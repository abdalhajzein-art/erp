<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام ERP المتكامل - الإصدار الاحترافي</title>
    
    <!-- ===== FONTS ===== -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    
    <!-- ===== CHART.JS ===== -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    
    <!-- ===== SUPABASE ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    
    <style>
        /* =============================================
                   CSS: التصميم العصري المتكامل
                ============================================= */
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #3b82f6;
            --secondary: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --info: #0891b2;
            --bg: #f0f2f5;
            --surface: #ffffff;
            --surface2: #f8fafc;
            --text: #1e293b;
            --text2: #64748b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.1);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-w: 260px;
            --header-h: 64px;
            --font: 'Cairo', sans-serif;
        }
        
        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface2: #334155;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --border: #334155;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            font-size: 14px;
            line-height: 1.7;
        }
        
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--text2);
            border-radius: 3px;
        }
        
        /* ===== TOAST NOTIFICATIONS ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
            width: 100%;
        }
        .toast {
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            color: #fff;
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            animation: slideInRight 0.4s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }
        .toast-success {
            background: rgba(5, 150, 105, 0.95);
        }
        .toast-error {
            background: rgba(220, 38, 38, 0.95);
        }
        .toast-warning {
            background: rgba(217, 119, 6, 0.95);
        }
        .toast-info {
            background: rgba(8, 145, 178, 0.95);
        }
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        /* ===== AUTH ===== */
        #authScreen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #2563eb 100%);
            padding: 20px;
            position: fixed;
            inset: 0;
            z-index: 9999;
        }
        .auth-container {
            width: 100%;
            max-width: 440px;
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
        }
        .auth-logo h1 {
            font-size: 2.6em;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-logo p {
            opacity: 0.7;
            font-size: 1em;
        }
        .auth-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 35px 30px;
            box-shadow: var(--shadow-lg);
            animation: fadeUp 0.5s ease;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .auth-card h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.3em;
        }
        
        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9em;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--text);
            transition: var(--transition);
            outline: none;
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        
        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 22px;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: var(--transition);
            min-height: 42px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
        }
        .btn-success {
            background: var(--secondary);
            color: #fff;
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
        }
        .btn-warning {
            background: var(--warning);
            color: #fff;
        }
        .btn-info {
            background: var(--info);
            color: #fff;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
            min-height: 32px;
        }
        .btn-lg {
            padding: 14px 32px;
            font-size: 16px;
            min-height: 50px;
        }
        .btn-block {
            width: 100%;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        
        /* ===== LAYOUT ===== */
        #appContainer {
            display: none;
            min-height: 100vh;
        }
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: var(--sidebar-w);
            height: 100vh;
            background: #0f172a;
            color: #cbd5e1;
            overflow-y: auto;
            z-index: 1000;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }
        .sidebar-header h2 {
            font-size: 1.4em;
            color: #fff;
            font-weight: 900;
        }
        .sidebar-header small {
            opacity: 0.5;
            font-size: 0.75em;
        }
        .sidebar-nav {
            flex: 1;
            padding: 8px 0;
            overflow-y: auto;
        }
        .nav-section {
            padding: 10px 20px 4px;
            font-size: 0.68em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 700;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            cursor: pointer;
            transition: var(--transition);
            border-right: 3px solid transparent;
            font-size: 0.9em;
        }
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .nav-item.active {
            background: rgba(37, 99, 235, 0.18);
            color: #60a5fa;
            border-right-color: #60a5fa;
            font-weight: 600;
        }
        .nav-item .icon {
            font-size: 1.2em;
            width: 24px;
            text-align: center;
        }
        .sidebar-footer {
            padding: 14px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 1em;
            flex-shrink: 0;
        }
        .user-name {
            font-size: 0.9em;
            color: #fff;
            font-weight: 600;
        }
        .user-role {
            font-size: 0.72em;
            opacity: 0.5;
        }
        
        .main-content {
            margin-right: var(--sidebar-w);
            min-height: 100vh;
            transition: var(--transition);
        }
        .top-header {
            height: var(--header-h);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            position: sticky;
            top: 0;
            z-index: 500;
            box-shadow: var(--shadow);
        }
        .top-header .page-title {
            font-size: 1.2em;
            font-weight: 700;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: var(--text);
            padding: 5px;
        }
        .page-content {
            padding: 25px;
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
        
        /* ===== CARDS & STATS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 22px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 18px;
            transition: var(--transition);
            border: 1px solid transparent;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }
        .stat-icon {
            width: 55px;
            height: 55px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            flex-shrink: 0;
        }
        .stat-icon.blue {
            background: #dbeafe;
            color: #2563eb;
        }
        .stat-icon.green {
            background: #d1fae5;
            color: #059669;
        }
        .stat-icon.orange {
            background: #fed7aa;
            color: #d97706;
        }
        .stat-icon.red {
            background: #fecaca;
            color: #dc2626;
        }
        .stat-icon.purple {
            background: #e9d5ff;
            color: #7c3aed;
        }
        .stat-icon.cyan {
            background: #cffafe;
            color: #0891b2;
        }
        [data-theme="dark"] .stat-icon.blue {
            background: #1e3a5f;
        }
        [data-theme="dark"] .stat-icon.green {
            background: #064e3b;
        }
        [data-theme="dark"] .stat-icon.orange {
            background: #78350f;
        }
        [data-theme="dark"] .stat-icon.red {
            background: #7f1d1d;
        }
        [data-theme="dark"] .stat-icon.purple {
            background: #4c1d95;
        }
        [data-theme="dark"] .stat-icon.cyan {
            background: #164e63;
        }
        .stat-info h3 {
            font-size: 1.6em;
            font-weight: 800;
            line-height: 1.2;
        }
        .stat-info p {
            font-size: 0.85em;
            color: var(--text2);
        }
        
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .card-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--surface2);
        }
        .card-header h3 {
            font-size: 1.05em;
            font-weight: 700;
        }
        .card-body {
            padding: 22px;
        }
        .card-body.no-pad {
            padding: 0;
        }
        
        /* ===== TABLES ===== */
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        table th,
        table td {
            padding: 12px 16px;
            text-align: right;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        table th {
            background: var(--surface2);
            font-weight: 700;
            color: var(--text2);
            font-size: 0.85em;
            position: sticky;
            top: 0;
        }
        table tr:hover {
            background: rgba(37, 99, 235, 0.04);
        }
        table tr:last-child td {
            border-bottom: none;
        }
        
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.78em;
            font-weight: 600;
        }
        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }
        .badge-warning {
            background: #fef3c7;
            color: #92400e;
        }
        .badge-danger {
            background: #fecaca;
            color: #991b1b;
        }
        .badge-info {
            background: #cffafe;
            color: #155e75;
        }
        .badge-primary {
            background: #dbeafe;
            color: #1e40af;
        }
        [data-theme="dark"] .badge-success {
            background: #064e3b;
            color: #6ee7b7;
        }
        [data-theme="dark"] .badge-warning {
            background: #78350f;
            color: #fcd34d;
        }
        [data-theme="dark"] .badge-danger {
            background: #7f1d1d;
            color: #fca5a5;
        }
        [data-theme="dark"] .badge-info {
            background: #164e63;
            color: #67e8f9;
        }
        [data-theme="dark"] .badge-primary {
            background: #1e3a5f;
            color: #93c5fd;
        }
        
        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-header {
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface2);
        }
        .modal-header h3 {
            font-size: 1.1em;
            font-weight: 700;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: var(--text2);
            padding: 0 5px;
            line-height: 1;
        }
        .modal-body {
            padding: 22px;
        }
        .modal-footer {
            padding: 15px 22px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            justify-content: flex-start;
            background: var(--surface2);
        }
        
        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        .toolbar .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }
        .toolbar .search-box input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface);
            color: var(--text);
            outline: none;
            transition: var(--transition);
        }
        .toolbar .search-box input:focus {
            border-color: var(--primary);
        }
        .toolbar .search-box::before {
            content: '🔍';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.9em;
        }
        
        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text2);
        }
        .empty-state .icon {
            font-size: 3em;
            margin-bottom: 15px;
        }
        .empty-state h3 {
            margin-bottom: 8px;
            color: var(--text);
        }
        
        /* ===== CHARTS ===== */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .chart-container {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
            border: 1px solid var(--border);
        }
        .chart-container h4 {
            margin-bottom: 15px;
            font-weight: 700;
        }
        .chart-container canvas {
            width: 100% !important;
            height: 250px !important;
        }
        
        /* ===== ACTIVITY ===== */
        .activity-item {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .activity-item:last-child {
            border-bottom: none;
        }
        .activity-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-top: 6px;
            flex-shrink: 0;
        }
        .activity-dot.blue {
            background: var(--primary);
        }
        .activity-dot.green {
            background: var(--secondary);
        }
        .activity-dot.red {
            background: var(--danger);
        }
        .activity-dot.orange {
            background: var(--warning);
        }
        .activity-text {
            flex: 1;
        }
        .activity-text p {
            font-size: 0.9em;
        }
        .activity-text small {
            color: var(--text2);
            font-size: 0.78em;
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-overlay.show {
                display: block;
            }
            .main-content {
                margin-right: 0;
            }
            .menu-toggle {
                display: block;
            }
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 768px) {
            .page-content {
                padding: 15px;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .stat-card {
                padding: 15px;
                gap: 12px;
            }
            .stat-icon {
                width: 42px;
                height: 42px;
                font-size: 1.1em;
            }
            .stat-info h3 {
                font-size: 1.2em;
            }
            .stat-info p {
                font-size: 0.75em;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .modal {
                max-width: 95vw;
            }
            .top-header {
                padding: 0 15px;
            }
            .top-header .page-title {
                font-size: 1em;
            }
            .card-header {
                padding: 14px 16px;
            }
            .card-body {
                padding: 16px;
            }
            table {
                font-size: 0.82em;
            }
            table th,
            table td {
                padding: 10px 12px;
            }
            .toolbar {
                flex-direction: column;
            }
            .toolbar .search-box {
                min-width: 100%;
            }
        }
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .stat-card {
                padding: 12px;
                gap: 8px;
                flex-direction: column;
                text-align: center;
            }
            .stat-icon {
                width: 38px;
                height: 38px;
                font-size: 1em;
            }
            .stat-info h3 {
                font-size: 1.1em;
            }
            .auth-container {
                padding-top: 4vh;
            }
            .auth-card {
                padding: 25px 18px;
            }
            .auth-logo h1 {
                font-size: 1.6em;
            }
            .page-content {
                padding: 10px;
            }
            .charts-grid {

    <!-- ============================================
    JAVASCRIPT - النظام الكامل
    ============================================ -->
    <script>
        /**
         * =============================================
         * نظام ERP المتكامل - الإصدار الاحترافي
         * مع تكامل Supabase
         * =============================================
         */

        'use strict';
        console.log('🚀 ERP System Loading...');

        // =============================================
        // 1. CONFIGURATION
        // =============================================

        // 🔑 أدخل مفاتيح Supabase الخاصة بك هنا
        // (احصل عليها مجاناً من https://supabase.com)
        const SUPABASE_URL = 'https://cjowclwbngjazvqabafq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_x5VrCVM22l39Do_jZEEa4w_YbKHvrum';

        // =============================================
        // 2. SUPABASE CLIENT
        // =============================================

        let supabase = null;
        let currentUser = null;
        let currentPage = 'dashboard';
        let posCart = [];

        try {
            const { createClient } = supabaseJs;
            supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('✅ Supabase client initialized');
        } catch (e) {
            console.error('❌ Supabase init error:', e);
            // Fallback: استخدام localStorage مؤقتاً
            supabase = null;
            toast('⚠️ Supabase غير متصل، جارٍ استخدام التخزين المحلي', 'warning');
        }

        // =============================================
        // 3. TOAST NOTIFICATIONS
        // =============================================

        function toast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const colors = {
                success: 'toast-success',
                error: 'toast-error',
                warning: 'toast-warning',
                info: 'toast-info'
            };
            const icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                info: 'ℹ️'
            };
            const el = document.createElement('div');
            el.className = `toast ${colors[type] || 'toast-info'}`;
            el.innerHTML = `${icons[type] || 'ℹ️'} ${message}`;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateX(-50px)';
                setTimeout(() => el.remove(), 400);
            }, 4000);
        }

        // =============================================
        // 4. AUTHENTICATION
        // =============================================

        async function doLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                toast('⚠️ يرجى إدخال البريد الإلكتروني وكلمة المرور', 'warning');
                return;
            }

            if (!supabase) {
                toast('⚠️ النظام غير متصل بالإنترنت، حاول مجدداً', 'error');
                return;
            }

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw error;

                currentUser = data.user;
                toast(`✅ مرحباً ${currentUser.user_metadata?.full_name || 'المدير'}`, 'success');
                showApp();
            } catch (error) {
                toast(`❌ خطأ: ${error.message}`, 'error');
            }
        }

        async function doRegister() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const company = document.getElementById('regCompany').value.trim();

            if (!name || !email || !password) {
                toast('⚠️ يرجى ملء جميع الحقول المطلوبة', 'warning');
                return;
            }
            if (password.length < 6) {
                toast('⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'warning');
                return;
            }

            if (!supabase) {
                toast('⚠️ النظام غير متصل بالإنترنت، حاول مجدداً', 'error');
                return;
            }

            try {
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            full_name: name,
                            company: company || 'شركتي',
                            role: 'admin'
                        }
                    }
                });

                if (error) throw error;

                toast('✅ تم إنشاء الحساب بنجاح! يمكنك تسجيل الدخول الآن', 'success');
                showLogin();
            } catch (error) {
                toast(`❌ خطأ: ${error.message}`, 'error');
            }
        }

        function showRegister() {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('registerCard').style.display = 'block';
        }

        function showLogin() {
            document.getElementById('loginCard').style.display = 'block';
            document.getElementById('registerCard').style.display = 'none';
        }

        function doLogout() {
            if (!confirm('هل تريد تسجيل الخروج؟')) return;

            if (supabase) {
                supabase.auth.signOut();
            }

            currentUser = null;
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('appContainer').style.display = 'none';
            toast('👋 تم تسجيل الخروج', 'info');
        }

        // =============================================
        // 5. APP INITIALIZATION
        // =============================================

        async function checkAuth() {
            if (!supabase) {
                // لوضع offline باستخدام localStorage
                const savedUser = localStorage.getItem('erp_user');
                if (savedUser) {
                    try {
                        currentUser = JSON.parse(savedUser);
                        showApp();
                        return;
                    } catch (e) {}
                }
                document.getElementById('authScreen').style.display = 'flex';
                document.getElementById('appContainer').style.display = 'none';
                return;
            }

            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    currentUser = session.user;
                    showApp();
                    return;
                }
            } catch (e) {
                console.warn('⚠️ Auth check failed:', e);
            }

            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('appContainer').style.display = 'none';
        }

        function showApp() {
            console.log('🏠 Showing app for:', currentUser?.email);

            // حفظ المستخدم محلياً
            if (currentUser) {
                localStorage.setItem('erp_user', JSON.stringify(currentUser));
            }

            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';

            const meta = currentUser?.user_metadata || {};
            document.getElementById('sidebarCompany').textContent = meta.company || 'الشركة';
            document.getElementById('userName').textContent = meta.full_name || 'المدير';
            document.getElementById('userRole').textContent = meta.role === 'admin' ? 'مدير النظام' : 'مستخدم';
            document.getElementById('userAvatar').textContent = (meta.full_name || 'م').charAt(0);

            // التحقق من الوضع الداكن
            if (localStorage.getItem('erp_theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }

            buildSidebar();
            navigate('dashboard');
            toast('📊 مرحباً بك في نظام ERP المتكامل', 'success');
        }

        // =============================================
        // 6. NAVIGATION
        // =============================================

        const NAV_ITEMS = [
            { section: 'الرئيسية' },
            { id: 'dashboard', icon: '📊', label: 'لوحة التحكم' },
            { id: 'pos', icon: '🛒', label: 'نقطة البيع' },
            { section: 'العمليات' },
            { id: 'sales', icon: '💰', label: 'المبيعات' },
            { id: 'purchases', icon: '🛍️', label: 'المشتريات' },
            { id: 'inventory', icon: '📦', label: 'المخزون' },
            { section: 'الأطراف' },
            { id: 'customers', icon: '👥', label: 'العملاء' },
            { id: 'suppliers', icon: '🏭', label: 'الموردين' },
            { id: 'employees', icon: '👔', label: 'الموظفين' },
            { section: 'الإدارة' },
            { id: 'projects', icon: '📋', label: 'المشاريع' },
            { id: 'assets', icon: '🏢', label: 'الأصول الثابتة' },
            { id: 'accounting', icon: '📒', label: 'المحاسبة' },
            { id: 'workflows', icon: '⚙️', label: 'سير العمل' },
            { section: 'النظام' },
            { id: 'reports', icon: '📈', label: 'التقارير' },
            { id: 'activity', icon: '📝', label: 'سجل النشاط' },
            { id: 'settings', icon: '⚙️', label: 'الإعدادات' },
        ];

        function buildSidebar() {
            const nav = document.getElementById('sidebarNav');
            let html = '';
            NAV_ITEMS.forEach(item => {
                if (item.section) {
                    html += `<div class="nav-section">${item.section}</div>`;
                } else {
                    html += `
                                <div class="nav-item" data-page="${item.id}" onclick="navigate('${item.id}')">
                                    <span class="icon">${item.icon}</span>
                                    <span>${item.label}</span>
                                </div>
                            `;
                }
            });
            nav.innerHTML = html;
        }

        function navigate(page) {
            currentPage = page;
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.toggle('active', el.dataset.page === page);
            });

            const titles = {
                dashboard: 'لوحة التحكم',
                pos: 'نقطة البيع',
                sales: 'المبيعات',
                purchases: 'المشتريات',
                inventory: 'المخزون',
                customers: 'العملاء',
                suppliers: 'الموردين',
                employees: 'الموظفين والرواتب',
                projects: 'المشاريع',
                assets: 'الأصول الثابتة',
                accounting: 'المحاسبة',
                workflows: 'سير العمل',
                reports: 'التقارير',
                activity: 'سجل النشاط',
                settings: 'الإعدادات'
            };
            document.getElementById('pageTitle').textContent = titles[page] || page;

            const content = document.getElementById('pageContent');
            content.className = 'page-content fade-in';

            const renderers = {
                dashboard: renderDashboard,
                pos: renderPOS,
                sales: renderSales,
                purchases: renderPurchases,
                inventory: renderInventory,
                customers: renderCustomers,
                suppliers: renderSuppliers,
                employees: renderEmployees,
                projects: renderProjects,
                assets: renderAssets,
                accounting: renderAccounting,
                workflows: renderWorkflows,
                reports: renderReports,
                activity: renderActivity,
                settings: renderSettings
            };

            if (renderers[page]) renderers[page]();

            if (window.innerWidth <= 1024) {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('show');
            }
            window.scrollTo(0, 0);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('show');
        }

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? '' : 'dark');
            localStorage.setItem('erp_theme', isDark ? '' : 'dark');
            toast(isDark ? '☀️ الوضع الفاتح' : '🌙 الوضع الداكن', 'info');
        }

        // =============================================
        // 7. MODAL
        // =============================================

        function openModal(title, bodyHtml, footerHtml, maxW = '600px') {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = bodyHtml;
            document.getElementById('modalFooter').innerHTML = footerHtml || '';
            document.getElementById('modalBox').style.maxWidth = maxW;
            document.getElementById('modalOverlay').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('show');
        }

        // =============================================
        // 8. UTILITY FUNCTIONS
        // =============================================

        function fmt(n) {
            const currency = localStorage.getItem('erp_currency') || 'ر.س';
            return (Number(n) || 0).toLocaleString('ar-SA', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) +
                ' ' + currency;
        }

        function fmtDate(d) {
            if (!d) return '-';
            return new Date(d).toLocaleDateString('ar-SA', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function fmtDateTime(d) {
            if (!d) return '-';
            return new Date(d).toLocaleString('ar-SA', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // =============================================
        // 9. DASHBOARD
        // =============================================

        let charts = {};

        async function renderDashboard() {
            const content = document.getElementById('pageContent');
            content.innerHTML = `
                        <div class="stats-grid" id="statsGrid">
                            <div class="stat-card"><div class="stat-icon blue">💰</div><div class="stat-info"><h3>...</h3><p>إجمالي المبيعات</p></div></div>
                            <div class="stat-card"><div class="stat-icon orange">🛍️</div><div class="stat-info"><h3>...</h3><p>إجمالي المشتريات</p></div></div>
                            <div class="stat-card"><div class="stat-icon green">📊</div><div class="stat-info"><h3>...</h3><p>مبيعات الشهر</p></div></div>
                            <div class="stat-card"><div class="stat-icon purple">📦</div><div class="stat-info"><h3>...</h3><p>المنتجات</p></div></div>
                            <div class="stat-card"><div class="stat-icon cyan">👥</div><div class="stat-info"><h3>...</h3><p>العملاء</p></div></div>
                            <div class="stat-card"><div class="stat-icon red">⚠️</div><div class="stat-info"><h3>...</h3><p>مخزون منخفض</p></div></div>
                        </div>
                        <div class="charts-grid">
                            <div class="chart-container"><h4>📈 المبيعات الشهرية</h4><canvas id="chartSales"></canvas></div>
                            <div class="chart-container"><h4>📊 توزيع المخزون</h4><canvas id="chartInventory"></canvas></div>
                        </div>
                        <div class="card"><div class="card-header"><h3>📝 آخر الأنشطة</h3></div>
                        <div class="card-body" id="activityList">
                            <div class="text-center" style="padding:20px;color:var(--text2);">جاري تحميل الأنشطة...</div>
                        </div></div>
                    `;

            // جلب البيانات (محاكاة - يمكن ربطها مع Supabase لاحقاً)
            // استخدام localStorage مؤقتاً
            const products = JSON.parse(localStorage.getItem('erp_products') || '[]');
            const sales = JSON.parse(localStorage.getItem('erp_sales') || '[]');
            const purchases = JSON.parse(localStorage.getItem('erp_purchases') || '[]');
            const customers = JSON.parse(localStorage.getItem('erp_customers') || '[]');

            const totalSales = sales.reduce((s, x) => s + (x.total || 0), 0);
            const totalPurchases = purchases.reduce((s, x) => s + (x.total || 0), 0);
            const lowStock = products.filter(p => p.stock <= (p.minStock || 0)).length;
            const thisMonth = new Date().toISOString().slice(0, 7);
            const monthSales = sales.filter(s => (s.date || '').startsWith(thisMonth)).reduce((s, x) => s + (x.total || 0),
            0);

            // تحديث الإحصائيات
            const stats = [
                { el: document.querySelector('.stat-card:nth-child(1) h3'), val: fmt(totalSales) },
                { el: document.querySelector('.stat-card:nth-child(2) h3'), val: fmt(totalPurchases) },
                { el: document.querySelector('.stat-card:nth-child(3) h3'), val: fmt(monthSales) },
                { el: document.querySelector('.stat-card:nth-child(4) h3'), val: products.length },
                { el: document.querySelector('.stat-card:nth-child(5) h3'), val: customers.length },
                { el: document.querySelector('.stat-card:nth-child(6) h3'), val: lowStock },
            ];
            stats.forEach(s => { if (s.el) s.el.textContent = s.val; });

            // رسم الرسوم البيانية
            setTimeout(() => {
                drawSalesChart(sales);
                drawInventoryChart(products);
            }, 100);

            // الأنشطة (محاكاة)
            const activities = JSON.parse(localStorage.getItem('erp_activities') || '[]');
            const activityList = document.getElementById('activityList');
            if (activities.length === 0) {
                activityList.innerHTML =
                    '<div class="empty-state"><div class="icon">📝</div><h3>لا توجد أنشطة بعد</h3></div>';
            } else {
                let html = '';
                activities.slice(0, 8).forEach(a => {
                    const colors = ['blue', 'green', 'orange', 'red'];
                    const c = colors[Math.abs(hashCode(a.text)) % colors.length];
                    html += `
                                <div class="activity-item">
                                    <div class="activity-dot ${c}"></div>
                                    <div class="activity-text">
                                        <p>${a.text}</p>
                                        <small>${a.user || 'النظام'} - ${fmtDateTime(a.date)}</small>
                                    </div>
                                </div>
                            `;
                });
                activityList.innerHTML = html;
            }
        }

        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash |= 0;
            }
            return hash;
        }

        function drawSalesChart(sales) {

            const ctx = canvas.getContext('2d');
            const container = canvas.parentElement;
            const w = container.clientWidth - 40;

        function filterPOS() {
            const q = document.getElementById('posSearch').value.toLowerCase();
            document.querySelectorAll('.pos-item').forEach(el => {
                const name = (el.dataset.name || '').toLowerCase();
                const barcode = (el.dataset.barcode || '').toLowerCase();
                el.style.display = (name.includes(q) || barcode.includes(q)) ? '' : 'none';
            });
        }

        function addToCart(productId) {
            const products = JSON.parse(localStorage.getItem('erp_products') || '[]');
            const p = products.find(x => x.id === productId);
            if (!p) return;
            if ((p.stock || 0) <= 0) { toast('⚠️ المنتج غير متوفر في المخزون', 'warning'); return; }

            const existing = posCart.find(x => x.productId === productId);
            if (existing) {
                if (existing.qty >= (p.stock || 0)) { toast('⚠️ الكمية المطلوبة تتجاوز المخزون المتاح', 'warning'); return; }
                existing.qty++;
            } else {
                posCart.push({ productId: p.id, name: p.name, price: p.price, qty: 1 });
            }
            updateCart();
        }

        function updateCart() {
            const container = document.getElementById('cartItems');
            const countEl = document.getElementById('cartCount');
            if (!container) return;

            if (posCart.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">🛒</div><p>السلة فارغة</p></div>';
                countEl.textContent = '0';
                document.getElementById('cartSubtotal').textContent = fmt(0);
                document.getElementById('cartTax').textContent = fmt(0);
                document.getElementById('cartTotal').textContent = fmt(0);
                return;
            }

            let html = '';
            let subtotal = 0;
            posCart.forEach((item, i) => {
                const total = item.price * item.qty;
                subtotal += total;
                html += `
                            <div class="cart-item" style="display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--border);">
                                <div class="cart-item-info" style="flex:1;">
                                    <h4 style="font-size:0.88em;font-weight:600;">${item.name}</h4>
                                    <span style="font-size:0.8em;color:var(--text2);">${fmt(item.price)}</span>
                                </div>
                                <div class="cart-item-qty" style="display:flex;align-items:center;gap:8px;">
                                    <button onclick="changeQty(${i},-1)" style="width:28px;height:28px;border:1px solid var(--border);background:var(--surface2);border-radius:50%;cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--text);">-</button>
                                    <span style="font-weight:700;min-width:20px;text-align:center;">${item.qty}</span>
                                    <button onclick="changeQty(${i},1)" style="width:28px;height:28px;border:1px solid var(--border);background:var(--surface2);border-radius:50%;cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--text);">+</button>
                                </div>
                                <div class="cart-item-total" style="font-weight:700;color:var(--primary);white-space:nowrap;">${fmt(total)}</div>
                                <button class="cart-item-remove" onclick="removeFromCart(${i})" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:1.2em;padding:0 5px;">✕</button>
                            </div>
                        `;
            });
            container.innerHTML = html;
            countEl.textContent = posCart.reduce((s, x) => s + x.qty, 0);

            const discount = Number(document.getElementById('posDiscount')?.value) || 0;
            const taxRate = 0.15;
            const afterDiscount = Math.max(0, subtotal - discount);
            const tax = afterDiscount * taxRate;
            const grandTotal = afterDiscount + tax;

            document.getElementById('cartSubtotal').textContent = fmt(subtotal);
            document.getElementById('cartTax').textContent = fmt(tax);
            document.getElementById('cartTotal').textContent = fmt(grandTotal);
        }

        function changeQty(idx, delta) {
            const item = posCart[idx];
            if (!item) return;
            const products = JSON.parse(localStorage.getItem('erp_products') || '[]');
            const p = products.find(x => x.id === item.productId);
            const newQty = item.qty + delta;
            if (newQty <= 0) { posCart.splice(idx, 1); } else if (p && newQty > (p.stock || 0)) { toast(
                    '⚠️ الكمية تتجاوز المخزون', 'warning'); return; } else { item.qty = newQty; }
            updateCart();
        }

        function removeFromCart(idx) {
            posCart.splice(idx, 1);
            updateCart();
        }

        function clearCart() {
            posCart = [];
            updateCart();
        }

        function completeSale() {
            if (posCart.length === 0) { toast('⚠️ السلة فارغة', 'warning'); return; }

            const subtotal = posCart.reduce((s, x) => s + x.price * x.qty, 0);
            const discount = Number(document.getElementById('posDiscount')?.value) || 0;
            const taxRate = 0.15;
            const afterDiscount = Math.max(0, subtotal - discount);
            const tax = afterDiscount * taxRate;
            const total = afterDiscount + tax;
            const customerId = document.getElementById('posCustomer')?.value || '';

            const sale = {
                id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
                invoiceNo: 'INV-' + Date.now().toString().slice(-6),
                items: [...posCart],
                subtotal: subtotal,
                discount: discount,
                tax: tax,
                total: total,
                customerId: customerId,
                date: new Date().toISOString(),
                user: currentUser?.user_metadata?.full_name || 'المدير',
                type: 'pos'
            };

            const sales = JSON.parse(localStorage.getItem('erp_sales') || '[]');
            sales.push(sale);
            localStorage.setItem('erp_sales', JSON.stringify(sales));

            // تحديث المخزون
            const products = JSON.parse(localStorage.getItem('erp_products') || '[]');
            posCart.forEach(item => {
                const p = products.find(x => x.id === item.productId);
                if (p) p.stock = Math.max(0, (p.stock || 0) - item.qty);
            });
            localStorage.setItem('erp_products', JSON.stringify(products));

            // تسجيل المعاملة
            const trans = JSON.parse(localStorage.getItem('erp_transactions') || '[]');
            trans.push({
                id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
                type: 'income',
                amount: total,
                description: 'فاتورة بيع ' + sale.invoiceNo,
                date: sale.date,
                category: 'مبيعات'
            });
            localStorage.setItem('erp_transactions', JSON.stringify(trans));

            // تسجيل النشاط
            logActivity('عملية بيع جديدة: ' + sale.invoiceNo + ' - ' + fmt(total));

            posCart = [];
            toast('✅ تم إتمام عملية البيع بنجاح!\nرقم الفاتورة: ' + sale.invoiceNo + '\nالإجمالي: ' + fmt(total), 'success');
            renderPOS();
        }

                        </div>

        function saveProduct(id) {
            const name = document.getElementById('pName').value.trim();
            if (!name) { toast('⚠️ يرجى إدخال اسم المنتج', 'warning'); return; }

            const data = {
                name: name,
                barcode: document.getElementById('pBarcode').value.trim(),
                category: document.getElementById('pCategory').value.trim() || 'عام',
                cost: Number(document.getElementById('pCost').value) || 0,
                price: Number(document.getElementById('pPrice').value) || 0,
                stock: Number(document.getElementById('pStock').value) || 0,
                minStock: Number(document.getElementById('pMinStock').value) || 5,
                description: document.getElementById('pDesc').value.trim()
            };

            const products = JSON.parse(localStorage.getItem('erp_products') || '[]');

            if (id) {
                const idx = products.findIndex(x => x.id === id);
                if (idx >= 0) Object.assign(products[idx], data);
                logActivity('تعديل منتج: ' + name);
            } else {
                data.id = Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
                data.createdAt = new Date().toISOString();
                products.push(data);
                logActivity('إضافة منتج جديد: ' + name);
            }

            localStorage.setItem('erp_products', JSON.stringify(products));
            closeModal();
            renderInventory();
            toast('✅ تم حفظ المنتج بنجاح', 'success');
        }

        function deleteProduct(id) {
            if (!confirm('هل تريد حذف هذا المنتج؟')) return;
            let products = JSON.parse(localStorage.getItem('erp_products') || '[]');
            const p = products.find(x => x.id === id);
            products = products.filter(x => x.id !== id);
            localStorage.setItem('erp_products', JSON.stringify(products));
            logActivity('حذف منتج: ' + (p ? p.name : id));
            renderInventory();
            toast('🗑️ تم حذف المنتج', 'info');
        }

        function saveContact(type, id) {
            const name = document.getElementById('cName').value.trim();
            if (!name) { toast('⚠️ يرجى إدخال الاسم', 'warning'); return; }

            const data = {
                name: name,
                phone: document.getElementById('cPhone').value.trim(),
                email: document.getElementById('cEmail').value.trim(),
                address: document.getElementById('cAddress').value.trim(),
                balance: Number(document.getElementById('cBalance').value) || 0,
                notes: document.getElementById('cNotes').value.trim()
            };

            const key = type === 'customer' ? 'customers' : 'suppliers';
            const items = JSON.parse(localStorage.getItem('erp_' + key) || '[]');

            if (id) {
                const idx = items.findIndex(x => x.id === id);
                if (idx >= 0) Object.assign(items[idx], data);
            } else {
                data.id = Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
                data.createdAt = new Date().toISOString();
                items.push(data);
            }

            localStorage.setItem('erp_' + key, JSON.stringify(items));
            const label = type === 'customer' ? 'عميل' : 'مورد';
            logActivity((id ? 'تعديل ' : 'إضافة ') + label + ': ' + name);
            closeModal();
            if (type === 'customer') renderCustomers();
            else renderSuppliers();
            toast('✅ تم الحفظ بنجاح', 'success');
        }

        function deleteContact(key, id) {
            if (!confirm('هل تريد الحذف؟')) return;
            let items = JSON.parse(localStorage.getItem('erp_' + key) || '[]');
            items = items.filter(x => x.id !== id);
            localStorage.setItem('erp_' + key, JSON.stringify(items));
            if (key === 'customers') renderCustomers();
            else renderSuppliers();
            toast('🗑️ تم الحذف', 'info');
        }

            const suppliers = JSON.parse(localStorage.getItem('erp_suppliers') || '[]');

            let body = `

            openModal('فاتورة شراء جديدة', body, footer, '700px');

        }

        function addPurchaseItem() {
            const prodId = document.getElementById('puProduct').value;
            const qty = Number(document.getElementById('puQty').value) || 0;
            const price = Number(document.getElementById('puPrice').value) || 0;

            if (!prodId || qty <= 0) { toast('⚠️ اختر منتج وكمية صحيحة', 'warning'); return; }

            const products = JSON.parse(localStorage.getItem('erp_products') || '[]');
            const p = products.find(x => x.id === prodId);

            window._puItems.push({ productId: prodId, name: p.name, qty: qty, price: price, total: qty * price });

            let html =
                `<table style="width:100%;font-size:0.85em"><thead><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th></th></tr></thead><tbody>`;
            window._puItems.forEach((item, i) => {
                html += `
                            <tr>
                                <td>${item.name}</td>
                                <td>${item.qty}</td>
                                <td>${fmt(item.price)}</td>
                                <td>${fmt(item.total)}</td>
                                <td><button class="btn btn-sm btn-danger" onclick="window._puItems.splice(${i},1);addPurchaseItem()">✕</button></td>
                            </tr>
                        `;
            });
            html += `</tbody></table>`;
            document.getElementById('puItems').innerHTML = html;

            // تفريغ الحقول
            document.getElementById('puProduct').value = '';
            document.getElementById('puQty').value = '1';
            document.getElementById('puPrice').value = '0';
        }

        function savePurchase() {
            if (!window._puItems || window._puItems.length === 0) { toast('⚠️ أضف منتجات أولاً', 'warning'); return; }

            const total = window._puItems.reduce((s, x) => s + x.total, 0);
            const purchase = {
                id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
                invoiceNo: 'PUR-' + Date.now().toString().slice(-6),
                supplierId: document.getElementById('puSupplier').value,
                date: document.getElementById('puDate').value || new Date().toISOString(),
                items: window._puItems,
                total: total,
                status: 'pending',
                notes: document.getElementById('puNotes').value.trim(),
                user: currentUser?.user_metadata?.full_name || 'المدير'
            };

            const purchases = JSON.parse(localStorage.getItem('erp_purchases') || '[]');
            purchases.push(purchase);
            localStorage.setItem('erp_purchases', JSON.stringify(purchases));

            // تحديث المخزون
            const products = JSON.parse(localStorage.getItem('erp_products') || '[]');
            window._puItems.forEach(item => {
                const p = products.find(x => x.id === item.productId);
                if (p) p.stock = (p.stock || 0) + item.qty;
            });
            localStorage.setItem('erp_products', JSON.stringify(products));

            // تسجيل المعاملة
            const trans = JSON.parse(localStorage.getItem('erp_transactions') || '[]');
            trans.push({
                id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
                type: 'expense',
                amount: total,
                description: 'فاتورة شراء ' + purchase.invoiceNo,
                date: purchase.date,
                category: 'مشتريات'
            });
            localStorage.setItem('erp_transactions', JSON.stringify(trans));

            logActivity('فاتورة شراء: ' + purchase.invoiceNo + ' - ' + fmt(total));
            closeModal();
            renderPurchases();
            toast('✅ تم حفظ فاتورة الشراء بنجاح', 'success');
        }

        function deletePurchase(id) {
            if (!confirm('هل تريد حذف هذه الفاتورة؟')) return;
            let purchases = JSON.parse(localStorage.getItem('erp_purchases') || '[]');
            purchases = purchases.filter(x => x.id !== id);
            localStorage.setItem('erp_purchases', JSON.stringify(purchases));
            renderPurchases();
            toast('🗑️ تم حذف الفاتورة', 'info');
        }

        function saveEmployee(id) {
            const name = document.getElementById('eName').value.trim();
            if (!name) { toast('⚠️ أدخل اسم الموظف', 'warning'); return; }

            const data = {
                name: name,
                position: document.getElementById('ePosition').value.trim(),
                department: document.getElementById('eDept').value.trim(),
                phone: document.getElementById('ePhone').value.trim(),
                email: document.getElementById('eEmail').value.trim(),
                salary: Number(document.getElementById('eSalary').value) || 0,
                hireDate: document.getElementById('eHireDate').value,
                active: document.getElementById('eActive').value === 'true'
            };

            const items = JSON.parse(localStorage.getItem('erp_employees') || '[]');

            if (id) {

                if (idx >= 0) Object.assign(items[idx], data);
            } else {
                data.id = Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
                items.push(data);
            }

            renderEmployees();

            if (!confirm('حذف الموظف؟')) return;
            let items = JSON.parse(localStorage.getItem('erp_employees') || '[]');
            items = items.filter(x => x.id !== id);
            localStorage.setItem('erp_employees', JSON.stringify(items));
            renderEmployees();
            toast('🗑️ تم الحذف', 'info');
        }

        function processSalaries() {
            const employees = JSON.parse(localStorage.getItem('erp_employees') || '[]').filter(e => e.active !== false);
            if (employees.length === 0) { toast('⚠️ لا يوجد موظفين نشطين', 'warning'); return; }

            const total = employees.reduce((s, e) => s + (e.salary || 0), 0);
            if (!confirm('صرف رواتب ' + employees.length + ' موظف بإجمالي ' + fmt(total) + '؟')) return;

            const trans = JSON.parse(localStorage.getItem('erp_transactions') || '[]');
            employees.forEach(e => {
                trans.push({
                    id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
                    type: 'expense',
                    amount: e.salary || 0,
                    description: 'راتب: ' + e.name,
                    date: new Date().toISOString(),
                    category: 'رواتب'
                });
            });
            localStorage.setItem('erp_transactions', JSON.stringify(trans));
            logActivity('صرف رواتب: ' + employees.length + ' موظف - ' + fmt(total));
            toast('✅ تم صرف الرواتب بنجاح', 'success');
            renderEmployees();
        }

        // =============================================
        // 21. ACCOUNTING
        // =============================================

        function renderAccounting() {
            const trans = JSON.parse(localStorage.getItem('erp_transactions') || '[]');
            const income = trans.filter(t => t.type === 'income').reduce((s, t) => s + (t.amount || 0), 0);
            const expense = trans.filter(t => t.type === 'expense').reduce((s, t) => s + (t.amount || 0), 0);
            const profit = income - expense;

            let html = `
                        <div class="stats-grid">
                            <div class="stat-card"><div class="stat-icon green">📈</div><div class="stat-info"><h3>${fmt(income)}</h3><p>إجمالي الإيرادات</p></div></div>

                            <div class="stat-card"><div class="stat-icon ${profit>=0?'blue':'red'}">💹</div><div class="stat-info"><h3>${fmt(profit)}</h3><p>صافي الربح</p></div></div>
                            <div class="stat-card"><div class="stat-icon purple">📊</div><div class="stat-info"><h3>${trans.length}</h3><p>عدد المعاملات</p></div></div>

                            <button class="btn btn-danger" onclick="openTransModal('expense')">➕ مصروف</button>

                        <table id="transTable"><thead><tr><th>التاريخ</th><th>النوع</th><th>الفئة</th><th>الوصف</th><th>المبلغ</th><th>إجراءات</th></tr></thead><tbody>

                html +=
                    `<tr><td colspan="6" class="text-center" style="padding:40px"><div class="empty-state"><div class="icon">📒</div><h3>لا توجد معاملات مالية</h3></div></td></tr>`;
            } else {
                trans.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(t => {
                    html += `
                                <tr>
                                    <td>${fmtDate(t.date)}</td>

                                    <td>${t.description||'-'}</td>
                                    <td style="font-weight:700;color:${t.type==='income'?'var(--secondary)':'var(--danger)'};">${fmt(t.amount)}</td>

                                </tr>

                        </tbody></table></div></div></div>

            document.getElementById('pageContent').innerHTML = html;

        // =============================================
        // 22. WORKFLOWS (مختصر)
        // =============================================

        function renderWorkflows() {
            const workflows = JSON.parse(localStorage.getItem('erp_workflows') || '[]');

            let html = `
                        <div class="toolbar">
                            <button class="btn btn-primary" onclick="openWorkflowModal()">➕ طلب جديد</button>
                        </div>
                    `;

            if (workflows.length === 0) {
                html +=
                    `<div class="card"><div class="card-body"><div class="empty-state"><div class="icon">⚙️</div><h3>لا توجد طلبات</h3><p>أنشئ طلب موافقة جديد</p></div></div></div>`;
            } else {
                const statusColors = { pending: 'warning', approved: 'success', rejected: 'danger' };
                const statusLabels = { pending: 'قيد المراجعة', approved: 'موافق عليه', rejected: 'مرفوض' };

                workflows.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(w => {
                    const steps = w.steps || [];
                    const currentStep = steps.findIndex(s => s.status === 'pending');

                    html += `
                                <div class="workflow-card" style="background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px;transition:var(--transition);">
                                    <div class="wf-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                                        <div>
                                            <span class="wf-title" style="font-weight:700;">${w.title}</span>
                                            <span class="badge badge-${statusColors[w.status]||'info'}">${statusLabels[w.status]||w.status}</span>
                                        </div>
                                        <div class="btn-group">
                                            ${w.status==='pending' ? `
                                                <button class="btn btn-sm btn-success" onclick="approveWorkflow('${w.id}')">✅</button>
                                                <button class="btn btn-sm btn-danger" onclick="rejectWorkflow('${w.id}')">❌</button>
                                            ` : ''}
                                            <button class="btn btn-sm btn-danger" onclick="deleteWorkflow('${w.id}')">🗑️</button>
                                        </div>
                                    </div>
                                    <div class="wf-meta" style="font-size:0.85em;color:var(--text2);">
                                        ${w.description}<br>
                                        بواسطة: ${w.requestedBy} - ${fmtDate(w.date)}
                                    </div>
                                    <div class="workflow-steps" style="display:flex;gap:5px;margin-top:10px;">
                                        ${steps.map((s,i) => {
                                            let cls = '';
                                            if(s.status==='approved') cls='done';
                                            else if(s.status==='rejected') cls='';
                                            else if(i===currentStep) cls='current';
                                            return `<div class="wf-step ${cls}" style="flex:1;height:6px;border-radius:3px;background:${cls==='done'?'var(--secondary)':cls==='current'?'var(--warning)':'var(--border)'};" title="${s.label||''}"></div>`;
                                        }).join('')}
                                    </div>
                                </div>
                            `;
                });
            }

            document.getElementById('pageContent').innerHTML = html;
        }

        function openWorkflowModal() {

        function saveWorkflow() {
            const title = document.getElementById('wfTitle').value.trim();
            if (!title) { toast('⚠️ أدخل عنوان الطلب', 'warning'); return; }

            const numSteps = Number(document.getElementById('wfSteps').value) || 2;
            const steps = [];
            for (let i = 0; i < numSteps; i++) {
                steps.push({ label: 'مرحلة ' + (i + 1), status: i === 0 ? 'pending' : 'waiting' });
            }

            const wf = {
                id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
                title: title,
                description: document.getElementById('wfDesc').value.trim(),
                type: document.getElementById('wfType').value,
                status: 'pending',
                steps: steps,
                requestedBy: currentUser?.user_metadata?.full_name || 'المدير',
                date: new Date().toISOString()
            };

            const items = JSON.parse(localStorage.getItem('erp_workflows') || '[]');
            items.push(wf);
            localStorage.setItem('erp_workflows', JSON.stringify(items));

            logActivity('طلب موافقة جديد: ' + title);
            closeModal();
            renderWorkflows();
            toast('✅ تم إرسال الطلب', 'success');
        }

        function approveWorkflow(id) {
            const items = JSON.parse(localStorage.getItem('erp_workflows') || '[]');
            const w = items.find(x => x.id === id);
            if (!w) return;

            const currentStep = (w.steps || []).find(s => s.status === 'pending');
            if (currentStep) {
                currentStep.status = 'approved';
                currentStep.approvedBy = currentUser?.user_metadata?.full_name || 'المدير';
                currentStep.approvedAt = new Date().toISOString();

                const nextStep = w.steps.find(s => s.status === 'waiting');
                if (nextStep) nextStep.status = 'pending';
                else w.status = 'approved';
            }

            localStorage.setItem('erp_workflows', JSON.stringify(items));
            logActivity('موافقة على: ' + w.title);
            renderWorkflows();
            toast('✅ تمت الموافقة', 'success');
        }

        function rejectWorkflow(id) {
            if (!confirm('رفض هذا الطلب؟')) return;

            const items = JSON.parse(localStorage.getItem('erp_workflows') || '[]');
            const w = items.find(x => x.id === id);
            if (!w) return;

            w.status = 'rejected';
            const currentStep = (w.steps || []).find(s => s.status === 'pending');
            if (currentStep) {
                currentStep.status = 'rejected';
                currentStep.rejectedBy = currentUser?.user_metadata?.full_name || 'المدير';
            }

            localStorage.setItem('erp_workflows', JSON.stringify(items));
            logActivity('رفض طلب: ' + w.title);
            renderWorkflows();
            toast('❌ تم الرفض', 'info');
        }

        function deleteWorkflow(id) {
            if (!confirm('حذف الطلب؟')) return;
            let items = JSON.parse(localStorage.getItem('erp_workflows') || '[]');
            items = items.filter(x => x.id !== id);
            localStorage.setItem('erp_workflows', JSON.stringify(items));
            renderWorkflows();

        }

        function exportCSV(type) {
            let data = [];
            let headers = [];

            if (type === 'sales') {
                headers = ['رقم الفاتورة', 'التاريخ', 'المجموع', 'الضريبة', 'الإجمالي'];
                JSON.parse(localStorage.getItem('erp_sales') || '[]').forEach(s => {
                    data.push([s.invoiceNo, s.date, s.subtotal, s.tax, s.total]);
                });
            } else if (type === 'purchases') {
                headers = ['رقم الفاتورة', 'التاريخ', 'الإجمالي', 'الحالة'];
                JSON.parse(localStorage.getItem('erp_purchases') || '[]').forEach(p => {
                    data.push([p.invoiceNo, p.date, p.total, p.status]);
                });
            } else if (type === 'inventory') {
                headers = ['المنتج', 'الفئة', 'سعر الشراء', 'سعر البيع', 'المخزون', 'الحد الأدنى'];
                JSON.parse(localStorage.getItem('erp_products') || '[]').forEach(p => {
                    data.push([p.name, p.category, p.cost, p.price, p.stock, p.minStock]);
                });
            } else if (type === 'financial') {
                headers = ['التاريخ', 'النوع', 'الفئة', 'الوصف', 'المبلغ'];
                JSON.parse(localStorage.getItem('erp_transactions') || '[]').forEach(t => {
                    data.push([t.date, t.type, t.category, t.description, t.amount]);
                });
            } else if (type === 'employees') {
                headers = ['الاسم', 'المنصب', 'القسم', 'الراتب'];
                JSON.parse(localStorage.getItem('erp_employees') || '[]').forEach(e => {
                    data.push([e.name, e.position, e.department, e.salary]);
                });
            } else if (type === 'assets') {
                headers = ['الأصل', 'الفئة', 'قيمة الشراء', 'العمر الافتراضي'];
                JSON.parse(localStorage.getItem('erp_assets') || '[]').forEach(a => {
                    data.push([a.name, a.category, a.cost, a.usefulLife]);
                });
            }

            const BOM = '\uFEFF';
            let csv = BOM + headers.join(',') + '\n';
            data.forEach(row => {
                csv += row.map(cell => '"' + (cell != null ? String(cell).replace(/"/g, '""') : '') + '"').join(
                    ',') + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = type + '_report_' + new Date().toISOString().slice(0, 10) + '.csv';
            a.click();
            URL.revokeObjectURL(url);
            logActivity('تصدير تقرير: ' + type);
            toast('📥 تم تصدير التقرير', 'success');
        }

        function importData(input) {
            const file = input.files[0];
            if (!file) return;
            if (!confirm('⚠️ سيتم استبدال البيانات الحالية. متابعة؟')) { input.value = ''; return; }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    Object.keys(data).forEach(key => {
                        if (key.startsWith('erp_')) localStorage.setItem(key, data[key]);
                    });
                    logActivity('استيراد نسخة احتياطية');
                    toast('✅ تم استيراد البيانات بنجاح', 'success');
                    location.reload();
                } catch (err) {
                    toast('❌ خطأ في قراءة الملف: ' + err.message, 'error');
                }
            };
            reader.readAsText(file);
        }

            if (!confirm('⚠️ هل أنت متأكد؟ سيتم حذف جميع البيانات نهائياً!')) return;

            const keys = [];
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k.startsWith('erp_')) keys.push(k);
            }
            keys.forEach(k => localStorage.removeItem(k));

            toast('✅ تم إعادة تعيين النظام', 'success');
            setTimeout(() => location.reload(), 1000);
