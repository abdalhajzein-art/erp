<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام ERP المتكامل - الإصدار الاحترافي الكامل</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #3b82f6;
            --secondary: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --info: #0891b2;
            --bg: #f1f5f9;
            --surface: #ffffff;
            --surface2: #f8fafc;
            --text: #0f172a;
            --text2: #64748b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
            --sidebar-w: 270px;
            --header-h: 64px;
            --font: 'Cairo', sans-serif;
        }
        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface2: #334155;
            --text: #f1f5f9;
            --text2: #94a3b8;
            --border: #334155;
            --shadow: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.4);
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.5);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; font-size:14px; line-height:1.6; }
        ::-webkit-scrollbar { width:6px; height:6px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--text2); border-radius:10px; }
        
        .toast-container { position:fixed; top:20px; left:20px; z-index:99999; display:flex; flex-direction:column; gap:10px; max-width:400px; width:100%; pointer-events:none; }
        .toast { padding:14px 20px; border-radius:var(--radius-sm); color:#fff; font-weight:600; box-shadow:var(--shadow-lg); animation:slideInLeft 0.4s ease; display:flex; align-items:center; gap:12px; pointer-events:auto; border:1px solid rgba(255,255,255,0.1); }
        .toast-success { background:rgba(5,150,105,0.95); }
        .toast-error { background:rgba(220,38,38,0.95); }
        .toast-warning { background:rgba(217,119,6,0.95); }
        .toast-info { background:rgba(37,99,235,0.95); }
        @keyframes slideInLeft { from { opacity:0; transform:translateX(-40px) scale(0.95); } to { opacity:1; transform:translateX(0) scale(1); } }
        
        #authScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; background:radial-gradient(circle at top right, #1e293b, #0f172a); padding:20px; position:fixed; inset:0; z-index:9999; }
        .auth-container { width:100%; max-width:460px; }
        .auth-logo { text-align:center; margin-bottom:35px; color:#fff; }
        .auth-logo h1 { font-size:2.8em; font-weight:900; letter-spacing:-1px; background:linear-gradient(135deg, #fff, #60a5fa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:8px; }
        .auth-card { background:var(--surface); border-radius:16px; padding:40px 35px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.25); animation:fadeUp 0.6s ease; border:1px solid var(--border); }
        @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        .auth-card h2 { text-align:center; margin-bottom:30px; font-size:1.4em; }
        
        .form-group { margin-bottom:18px; }
        .form-group label { display:block; margin-bottom:6px; font-weight:600; font-size:0.9em; }
        .form-control { width:100%; padding:11px 15px; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); transition:var(--transition); font-family:var(--font); font-size:0.95em; }
        .form-control:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,0.15); }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
        
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 24px; border:none; border-radius:var(--radius-sm); cursor:pointer; font-weight:700; font-size:14px; transition:var(--transition); min-height:44px; font-family:var(--font); }
        .btn:active { transform:scale(0.98); }
        .btn-primary { background:var(--primary); color:#fff; box-shadow:0 2px 5px rgba(37,99,235,0.3); }
        .btn-primary:hover { background:var(--primary-dark); box-shadow:0 4px 12px rgba(37,99,235,0.4); }
        .btn-success { background:var(--secondary); color:#fff; box-shadow:0 2px 5px rgba(5,150,105,0.3); }
        .btn-danger { background:var(--danger); color:#fff; }
        .btn-warning { background:var(--warning); color:#fff; }
        .btn-info { background:var(--info); color:#fff; }
        .btn-outline { background:transparent; border:1.5px solid var(--border); color:var(--text); }
        .btn-outline:hover { border-color:var(--primary); color:var(--primary); background:rgba(37,99,235,0.05); }
        .btn-sm { padding:6px 14px; font-size:12px; min-height:34px; border-radius:6px; }
        .btn-lg { padding:14px 32px; font-size:16px; min-height:52px; }
        .btn-block { width:100%; }
        .btn-group { display:flex; gap:6px; flex-wrap:wrap; }
        
        #appContainer { display:none; min-height:100vh; }
        .sidebar { position:fixed; top:0; right:0; width:var(--sidebar-w); height:100vh; background:#0f172a; color:#cbd5e1; overflow-y:auto; z-index:1000; transition:transform 0.3s ease; display:flex; flex-direction:column; border-left:1px solid rgba(255,255,255,0.05); }
        .sidebar-header { padding:24px 20px; text-align:center; border-bottom:1px solid rgba(255,255,255,0.08); flex-shrink:0; background:linear-gradient(180deg, rgba(37,99,235,0.1), transparent); }
        .sidebar-header h2 { font-size:1.5em; color:#fff; font-weight:900; letter-spacing:-0.5px; }
        .sidebar-header small { opacity:0.5; font-size:0.75em; display:block; margin-top:4px; }
        .sidebar-nav { flex:1; padding:10px 0; overflow-y:auto; }
        .nav-section { padding:15px 24px 6px; font-size:0.7em; text-transform:uppercase; letter-spacing:1.5px; color:rgba(255,255,255,0.3); font-weight:800; }
        .nav-item { display:flex; align-items:center; gap:14px; padding:11px 24px; cursor:pointer; transition:var(--transition); border-right:3px solid transparent; font-size:0.92em; margin:2px 8px; border-radius:8px; }
        .nav-item:hover { background:rgba(255,255,255,0.06); color:#fff; }
        .nav-item.active { background:rgba(37,99,235,0.15); color:#60a5fa; border-right-color:#60a5fa; font-weight:600; }
        .nav-item .icon { font-size:1.2em; width:26px; text-align:center; opacity:0.9; }
        .sidebar-footer { padding:16px 20px; border-top:1px solid rgba(255,255,255,0.08); flex-shrink:0; background:rgba(0,0,0,0.2); }
        .user-info { display:flex; align-items:center; gap:12px; }
        .user-avatar { width:40px; height:40px; border-radius:10px; background:linear-gradient(135deg, var(--primary), var(--primary-dark)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:1.1em; flex-shrink:0; }
        .user-name { font-size:0.92em; color:#fff; font-weight:700; }
        .user-role { font-size:0.72em; opacity:0.5; margin-top:2px; }
        
        .main-content { margin-right:var(--sidebar-w); min-height:100vh; transition:margin 0.3s ease; }
        .top-header { height:var(--header-h); background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 30px; position:sticky; top:0; z-index:500; box-shadow:var(--shadow); }
        .page-title { font-size:1.25em; font-weight:800; }
        .header-actions { display:flex; align-items:center; gap:10px; }
        .menu-toggle { display:none; background:none; border:none; font-size:1.4em; cursor:pointer; color:var(--text); padding:8px; border-radius:8px; }
        .menu-toggle:hover { background:var(--surface2); }
        .page-content { padding:30px; max-width:1600px; margin:0 auto; }
        .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:999; backdrop-filter:blur(2px); }
        
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:20px; margin-bottom:30px; }
        .stat-card { background:var(--surface); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow); display:flex; align-items:center; gap:18px; transition:var(--transition); border:1px solid var(--border); }
        .stat-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-lg); border-color:var(--primary-light); }
        .stat-icon { width:56px; height:56px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:1.5em; flex-shrink:0; }
        .stat-icon.blue { background:#eff6ff; color:#2563eb; }
        .stat-icon.green { background:#ecfdf5; color:#059669; }
        .stat-icon.orange { background:#fffbeb; color:#d97706; }
        .stat-icon.red { background:#fef2f2; color:#dc2626; }
        .stat-icon.purple { background:#f5f3ff; color:#7c3aed; }
        .stat-icon.cyan { background:#ecfeff; color:#0891b2; }
        [data-theme="dark"] .stat-icon.blue { background:rgba(37,99,235,0.2); }
        [data-theme="dark"] .stat-icon.green { background:rgba(5,150,105,0.2); }
        [data-theme="dark"] .stat-icon.orange { background:rgba(217,119,6,0.2); }
        [data-theme="dark"] .stat-icon.red { background:rgba(220,38,38,0.2); }
        [data-theme="dark"] .stat-icon.purple { background:rgba(124,58,237,0.2); }
        [data-theme="dark"] .stat-icon.cyan { background:rgba(8,145,178,0.2); }
        .stat-info h3 { font-size:1.7em; font-weight:900; line-height:1.2; letter-spacing:-0.5px; }
        .stat-info p { font-size:0.85em; color:var(--text2); font-weight:500; margin-top:2px; }
        
        .card { background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:24px; overflow:hidden; border:1px solid var(--border); }
        .card-header { padding:20px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; background:var(--surface2); }
        .card-header h3 { font-size:1.05em; font-weight:800; }
        .card-body { padding:24px; }
        .card-body.no-pad { padding:0; }
        
        .table-responsive { overflow-x:auto; -webkit-overflow-scrolling:touch; }
        table { width:100%; border-collapse:collapse; font-size:0.9em; }
        table th, table td { padding:14px 18px; text-align:right; border-bottom:1px solid var(--border); white-space:nowrap; }
        table th { background:var(--surface2); font-weight:700; color:var(--text2); font-size:0.82em; text-transform:uppercase; letter-spacing:0.5px; position:sticky; top:0; z-index:10; }
        table tbody tr:hover { background:rgba(37,99,235,0.03); }
        
        .badge { display:inline-flex; align-items:center; padding:4px 12px; border-radius:20px; font-size:0.78em; font-weight:700; letter-spacing:0.3px; }
        .badge-success { background:#dcfce7; color:#166534; }
        .badge-warning { background:#fef9c3; color:#854d0e; }
        .badge-danger { background:#fee2e2; color:#991b1b; }
        .badge-info { background:#cffafe; color:#155e75; }
        .badge-primary { background:#dbeafe; color:#1e40af; }
        [data-theme="dark"] .badge-success { background:rgba(22,101,52,0.3); color:#86efac; }
        [data-theme="dark"] .badge-warning { background:rgba(133,77,14,0.3); color:#fde047; }
        [data-theme="dark"] .badge-danger { background:rgba(153,27,27,0.3); color:#fca5a5; }
        [data-theme="dark"] .badge-info { background:rgba(21,94,117,0.3); color:#67e8f9; }
        [data-theme="dark"] .badge-primary { background:rgba(30,64,175,0.3); color:#93c5fd; }
        
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(15,23,42,0.7); z-index:2000; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(5px); }
        .modal-overlay.show { display:flex; }
        .modal { background:var(--surface); border-radius:16px; width:100%; max-width:600px; max-height:90vh; overflow-y:auto; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5); animation:modalIn 0.3s ease; border:1px solid var(--border); }
        @keyframes modalIn { from { opacity:0; transform:scale(0.95) translateY(10px); } to { opacity:1; transform:scale(1) translateY(0); } }
        .modal-header { padding:20px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; background:var(--surface2); border-radius:16px 16px 0 0; }
        .modal-header h3 { font-size:1.15em; font-weight:800; }
        .modal-close { background:none; border:none; font-size:1.6em; cursor:pointer; color:var(--text2); padding:0 5px; line-height:1; transition:var(--transition); border-radius:6px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; }
        .modal-close:hover { background:var(--surface); color:var(--danger); }
        .modal-body { padding:24px; }
        .modal-footer { padding:16px 24px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; background:var(--surface2); border-radius:0 0 16px 16px; }
        
        .toolbar { display:flex; gap:12px; margin-bottom:24px; flex-wrap:wrap; align-items:center; }
        .toolbar .search-box { flex:1; min-width:240px; position:relative; }
        .toolbar .search-box input { width:100%; padding:11px 16px 11px 42px; border:1.5px solid var(--border); border-radius:var(--radius-sm); background:var(--surface); color:var(--text); transition:var(--transition); font-family:var(--font); }
        .toolbar .search-box input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,0.1); }
        .toolbar .search-box::before { content:'🔍'; position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:0.9em; opacity:0.6; }
        
        .empty-state { text-align:center; padding:60px 20px; color:var(--text2); }
        .empty-state .icon { font-size:3.5em; margin-bottom:16px; opacity:0.8; }
        .empty-state h3 { margin-bottom:8px; color:var(--text); font-weight:700; }
        
        .charts-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(400px,1fr)); gap:24px; margin-bottom:30px; }
        .chart-container { background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow); padding:24px; border:1px solid var(--border); }
        .chart-container h4 { margin-bottom:20px; font-weight:800; font-size:1.05em; }
        .chart-container canvas { width:100% !important; height:280px !important; }
        
        .activity-item { display:flex; gap:14px; padding:14px 0; border-bottom:1px solid var(--border); }
        .activity-item:last-child { border-bottom:none; }
        .activity-dot { width:10px; height:10px; border-radius:50%; margin-top:7px; flex-shrink:0; box-shadow:0 0 0 3px var(--surface); }
        .activity-dot.blue { background:var(--primary); }
        .activity-dot.green { background:var(--secondary); }
        .activity-dot.red { background:var(--danger); }
        .activity-dot.orange { background:var(--warning); }
        .activity-text p { font-size:0.92em; font-weight:500; }
        .activity-text small { color:var(--text2); font-size:0.78em; display:block; margin-top:3px; }
        
        @media (max-width:1024px) { .sidebar { transform:translateX(100%); } .sidebar.open { transform:translateX(0); box-shadow:-10px 0 30px rgba(0,0,0,0.3); } .sidebar-overlay.show { display:block; } .main-content { margin-right:0; } .menu-toggle { display:block; } .charts-grid { grid-template-columns:1fr; } }
        @media (max-width:768px) { .page-content { padding:20px 15px; } .stats-grid { grid-template-columns:repeat(2,1fr); gap:12px; } .stat-card { padding:16px; gap:12px; } .stat-icon { width:44px; height:44px; font-size:1.2em; border-radius:10px; } .stat-info h3 { font-size:1.3em; } .form-row { grid-template-columns:1fr; } .modal { max-width:95vw; margin:10px; } .top-header { padding:0 15px; } }
        @media (max-width:480px) { .stats-grid { grid-template-columns:1fr; } .auth-card { padding:30px 20px; } .auth-logo h1 { font-size:2em; } }
        
        @media print { .sidebar, .top-header, .toolbar, .btn, .modal-overlay, .toast-container { display:none !important; } .main-content { margin:0 !important; } .page-content { padding:0 !important; } body { background:#fff; color:#000; } .card { box-shadow:none; border:1px solid #ddd; } }
        
        .text-center { text-align:center; }
        .mt-10 { margin-top:10px; } .mt-20 { margin-top:20px; }
        .mb-10 { margin-bottom:10px; } .mb-20 { margin-bottom:20px; }
        .flex { display:flex; } .flex-between { display:flex; justify-content:space-between; align-items:center; }
        .gap-10 { gap:10px; } .hidden { display:none !important; } .w-full { width:100%; }
        
        .loading-spinner { display:inline-block; width:44px; height:44px; border:4px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .fade-in { animation:fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>
<body>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- AUTH SCREEN -->
    <div id="authScreen">
        <div class="auth-container">
            <div class="auth-logo">
                <h1>⚡ ERP PRO</h1>
                <p>نظام إدارة موارد المؤسسات المتكامل | الإصدار الاحترافي</p>
            </div>
            <div class="auth-card" id="loginCard">
                <h2>🔐 تسجيل الدخول</h2>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="admin@company.com" value="admin@demo.com" />
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" value="password" onkeypress="if(event.key==='Enter')doLogin()" />
                </div>
                <button class="btn btn-primary btn-lg btn-block" onclick="doLogin()">🔓 دخول للنظام</button>
                <div class="mt-20 text-center">
                    <button class="btn btn-outline btn-sm" onclick="showRegister()">📝 إنشاء حساب جديد</button>
                </div>
            </div>
            <div class="auth-card" id="registerCard" style="display:none;">
                <h2>📝 إنشاء حساب جديد</h2>
                <div class="form-group"><label>الاسم الكامل</label><input type="text" id="regName" class="form-control" placeholder="أدخل اسمك الكامل" /></div>
                <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="regEmail" class="form-control" placeholder="admin@company.com" /></div>
                <div class="form-group"><label>كلمة المرور</label><input type="password" id="regPassword" class="form-control" placeholder="•••••••• (6 أحرف على الأقل)" /></div>
                <div class="form-group"><label>اسم الشركة</label><input type="text" id="regCompany" class="form-control" placeholder="اسم شركتك" /></div>
                <button class="btn btn-success btn-lg btn-block" onclick="doRegister()">🚀 إنشاء الحساب</button>
                <div class="mt-20 text-center"><button class="btn btn-outline btn-sm" onclick="showLogin()">🔐 لدي حساب بالفعل</button></div>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="appContainer">
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>⚡ ERP PRO</h2>
                <small id="sidebarCompany">الشركة</small>
            </div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">م</div>
                    <div>
                        <div class="user-name" id="userName">المدير</div>
                        <div class="user-role" id="userRole">مدير النظام</div>
                    </div>
                </div>
            </div>
        </aside>
        <main class="main-content">
            <header class="top-header">
                <div class="flex gap-10" style="align-items:center;">
                    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                    <h2 class="page-title" id="pageTitle">لوحة التحكم</h2>
                </div>
                <div class="header-actions">
                    <button class="btn btn-sm btn-outline" onclick="toggleTheme()" title="تبديل الوضع">🌓</button>
                    <button class="btn btn-sm btn-danger" onclick="doLogout()">🚪 خروج</button>
                </div>
            </header>
            <div class="page-content" id="pageContent">
                <div class="text-center" style="padding:80px;">
                    <div class="loading-spinner"></div>
                    <p style="margin-top:20px;color:var(--text2);font-weight:600;">جاري تحميل النظام...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalBox">
            <div class="modal-header">
                <h3 id="modalTitle">عنوان</h3>

            el.className = `toast ${colors[type] || 'toast-info'}`;

        function buildSidebar() {
            const nav = $('sidebarNav');
            let html = '';
            NAV_ITEMS.forEach(item => {
                if (item.section) {
                    html += `<div class="nav-section">${item.section}</div>`;
                } else {
                    const perm = permissions[item.id] || '';
                    if (perm === '' || perm === 'none') return;
                    html += `<div class="nav-item" data-page="${item.id}" onclick="navigate('${item.id}')">
                        <span class="icon">${item.icon}</span><span>${item.label}</span>
                    </div>`;
                }
            });
            nav.innerHTML = html;
        }

        function navigate(page) {
            if (!hasPermission(page)) {
                toast('⚠️ ليس لديك صلاحية لهذه الصفحة', 'warning');
                return;
            }

            currentPage = page;
            document.querySelectorAll('.nav-item').forEach(el =>
                el.classList.toggle('active', el.dataset.page === page)
            );

            const titles = {};
            NAV_ITEMS.forEach(i => { if (i.id) titles[i.id] = i.label; });
            $('pageTitle').textContent = titles[page] || page;

            const content = $('pageContent');
            content.className = 'page-content fade-in';
            content.innerHTML = '<div class="text-center" style="padding:60px;"><div class="loading-spinner"></div></div>';

            setTimeout(() => {
                const renderers = {
                    dashboard: renderDashboard,
                    pos: renderPOS,
                    sales: renderSales,
                    purchases: renderPurchases,
                    inventory: renderInventory,
                    customers: renderCustomers,
                    suppliers: renderSuppliers,
                    employees: renderEmployees,
                    projects: renderProjects,
                    assets: renderAssets,
                    accounting: renderAccounting,
                    workflows: renderWorkflows,
                    reports: renderReports,
                    activity: renderActivity,
                    settings: renderSettings,
                    users: renderUsers,
                    branches: renderBranches
                };
                if (renderers[page]) renderers[page]();

                if (window.innerWidth <= 1024) {
                    $('sidebar').classList.remove('open');
                    $('sidebarOverlay').classList.remove('show');
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 150);
        }

        function hasPermission(page) {
            const perm = permissions[page] || '';
            return perm !== '' && perm !== 'none';

        // =============================================

        function renderDashboard() {
            const products = JSON.parse(localStorage.getItem('erp_products') || '[]');
            const sales = JSON.parse(localStorage.getItem('erp_sales') || '[]');
            const purchases = JSON.parse(localStorage.getItem('erp_purchases') || '[]');
            const customers = JSON.parse(localStorage.getItem('erp_customers') || '[]');
            const employees = JSON.parse(localStorage.getItem('erp_employees') || '[]');

            const totalSales = sales.reduce((s, x) => s + (x.total || 0), 0);
            const totalPurchases = purchases.reduce((s, x) => s + (x.total || 0), 0);
            const lowStock = products.filter(p => p.stock <= (p.minStock || 0)).length;
            const thisMonth = new Date().toISOString().slice(0, 7);
            const monthSales = sales.filter(s => (s.date || '').startsWith(thisMonth)).reduce((s, x) => s + (x.total || 0),
                0);
            const profit = totalSales - totalPurchases;

            $('pageContent').innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-icon blue">💰</div><div class="stat-info"><h3>${fmt(totalSales)}</h3><p>إجمالي المبيعات</p></div></div>
                    <div class="stat-card"><div class="stat-icon orange">🛍️</div><div class="stat-info"><h3>${fmt(totalPurchases)}</h3><p>إجمالي المشتريات</p></div></div>
                    <div class="stat-card"><div class="stat-icon green">📊</div><div class="stat-info"><h3>${fmt(monthSales)}</h3><p>مبيعات الشهر</p></div></div>
                    <div class="stat-card"><div class="stat-icon purple">📦</div><div class="stat-info"><h3>${products.length}</h3><p>المنتجات</p></div></div>
                    <div class="stat-card"><div class="stat-icon cyan">👥</div><div class="stat-info"><h3>${customers.length}</h3><p>العملاء</p></div></div>
                    <div class="stat-card"><div class="stat-icon ${profit>=0?'blue':'red'}">💹</div><div class="stat-info"><h3>${fmt(profit)}</h3><p>صافي الربح</p></div></div>
                    <div class="stat-card"><div class="stat-icon red">⚠️</div><div class="stat-info"><h3>${lowStock}</h3><p>مخزون منخفض</p></div></div>
                    <div class="stat-card"><div class="stat-icon green">👔</div><div class="stat-info"><h3>${employees.filter(e=>e.active!==false).length}</h3><p>الموظفين النشطين</p></div></div>
                </div>
                <div class="charts-grid">
                    <div class="chart-container"><h4>📈 تحليل المبيعات</h4><canvas id="chartSales"></canvas></div>
                    <div class="chart-container"><h4>📊 توزيع المخزون</h4><canvas id="chartInventory"></canvas></div>
                </div>
                <div class="card">
                    <div class="card-header"><h3>📝 آخر الأنشطة</h3></div>
                    <div class="card-body" id="dashActivity"><div class="text-center" style="color:var(--text2);">جاري التحميل...</div></div>
                </div>
            `;

            setTimeout(() => {
                drawSalesChart(sales);
                drawInventoryChart(products);
                const activities = JSON.parse(localStorage.getItem('erp_activities') || '[]');
                const actContainer = $('dashActivity');
                if (activities.length === 0) {
                    actContainer.innerHTML = '<div class="empty-state"><p>لا توجد أنشطة مسجلة</p></div>';
                } else {
                    let html = '';
                    activities.slice(0, 6).forEach(a => {
                        const colors = ['blue', 'green', 'orange', 'red'];
                        const c = colors[Math.abs(hashCode(a.text)) % colors.length];
                        html += `<div class="activity-item">
                            <div class="activity-dot ${c}"></div>
                            <div class="activity-text"><p>${a.text}</p><small>${a.user} - ${fmtDateTime(a.date)}</small></div>
                        </div>`;
                    });
                    actContainer.innerHTML = html;
                }
            }, 150);
        }

        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = ((hash << 5) - hash) + str.charCodeAt(i);
            return hash;
        }

        function drawSalesChart(sales) {
            const ctx = document.getElementById('chartSales');
            if (!ctx) return;
            if (chartsInstances.sales) chartsInstances.sales.destroy();

            const months = {};
            sales.forEach(s => {
                const m = (s.date || '').slice(0, 7);
                if (m) months[m] = (months[m] || 0) + (s.total || 0);
            });
            const keys = Object.keys(months).sort().slice(-6);

            chartsInstances.sales = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: keys.map(k => k.slice(5)),
                    datasets: [{
                        label: 'المبيعات',
                        data: keys.map(k => months[k]),
                        backgroundColor: 'rgba(37,99,235,0.8)',
                        borderRadius: 6,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, grid: { display: false } }, x: { grid: { display: false } } }
                }
            });
        }

        function drawInventoryChart(products) {
            const ctx = document.getElementById('chartInventory');
            if (!ctx) return;
            if (chartsInstances.inventory) chartsInstances.inventory.destroy();

            const categories = {};
            products.forEach(p => {
                const cat = p.category || 'عام';
                categories[cat] = (categories[cat] || 0) + (p.stock || 0);
            });

            chartsInstances.inventory = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(categories),
                    datasets: [{
                        data: Object.values(categories),
                        backgroundColor: ['#3b82f6', '#059669', '#d97706', '#dc2626', '#7c3aed', '#0891b2'],
                        borderWidth: 0,
                        hoverOffset: 10
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '70%',

                        legend: { position: 'bottom', labels: { font: { family: 'Cairo' }, usePointStyle: true } }

        function filterPOS() {
            const q = $('posSearch').value.toLowerCase();
            document.querySelectorAll('.pos-item').forEach(el => {
                const match = (el.dataset.name || '').toLowerCase().includes(q) || (el.dataset.barcode || '').includes(
                q);
                el.style.display = match ? '' : 'none';
            });
        }

        function addToCart(productId) {
            const products = JSON.parse(localStorage.getItem('erp_products') || '[]');
            const p = products.find(x => x.id === productId);
            if (!p) return;
            if ((p.stock || 0) <= 0) return toast('المنتج غير متوفر', 'warning');

            const existing = posCart.find(x => x.productId === productId);
            if (existing) {
                if (existing.qty >= (p.stock || 0)) return toast('تجاوزت المخزون', 'warning');
                existing.qty++;
            } else {
                posCart.push({ productId: p.id, name: p.name, price: p.price, qty: 1 });
            }
            updateCart();
        }

        function updateCart() {
            const container = $('cartItems');
            if (!container) return;

            if (posCart.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="icon">🛒</div><p>السلة فارغة</p></div>';
                $('cartCount').textContent = '0';
                $('cartSubtotal').textContent = fmt(0);
                $('cartTax').textContent = fmt(0);
                $('cartTotal').textContent = fmt(0);
                return;
            }

            let html = '';
            let subtotal = 0;
            posCart.forEach((item, i) => {
                const total = item.price * item.qty;
                subtotal += total;
                html += `
                    <div style="display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--border);">
                        <div style="flex:1;"><div style="font-weight:700;">${item.name}</div><div style="font-size:0.8em;color:var(--text2);">${fmt(item.price)}</div></div>
                        <div style="display:flex;align-items:center;gap:8px;">
                            <button onclick="changeQty(${i},-1)" style="width:28px;height:28px;border:1px solid var(--border);background:var(--surface);border-radius:50%;cursor:pointer;font-weight:bold;">-</button>
                            <span style="font-weight:800;min-width:20px;text-align:center;">${item.qty}</span>
                            <button onclick="changeQty(${i},1)" style="width:28px;height:28px;border:1px solid var(--border);background:var(--surface);border-radius:50%;cursor:pointer;font-weight:bold;">+</button>
                        </div>
                        <div style="font-weight:800;color:var(--primary);min-width:70px;text-align:left;">${fmt(total)}</div>
                        <button onclick="removeFromCart(${i})" style="background:none;border:none;color:var(--danger);cursor:pointer;font-size:1.2em;">✕</button>
                    </div>
                `;
            });
            container.innerHTML = html;
            $('cartCount').textContent = posCart.reduce((s, x) => s + x.qty, 0);

            const discount = Number($('posDiscount')?.value) || 0;
            const afterDiscount = Math.max(0, subtotal - discount);
            const tax = afterDiscount * CONFIG.taxRate;
            const grandTotal = afterDiscount + tax;

            $('cartSubtotal').textContent = fmt(subtotal);
            $('cartTax').textContent = fmt(tax);
            $('cartTotal').textContent = fmt(grandTotal);
        }

        function changeQty(idx, delta) {
            const item = posCart[idx];
            if (!item) return;
            const products = JSON.parse(localStorage.getItem('erp_products') || '[]');
            const p = products.find(x => x.id === item.productId);
            const newQty = item.qty + delta;
            if (newQty <= 0) posCart.splice(idx, 1);
            else if (p && newQty > (p.stock || 0)) toast('لا يوجد مخزون كافٍ', 'warning');
            else item.qty = newQty;
            updateCart();
        }

        function removeFromCart(idx) { posCart.splice(idx, 1);
            updateCart(); }

        function clearCart() { posCart = [];
            updateCart(); }

        function completeSale() {
            if (posCart.length === 0) return toast('السلة فارغة', 'warning');

            const subtotal = posCart.reduce((s, x) => s + x.price * x.qty, 0);
            const discount = Number($('posDiscount')?.value) || 0;
            const afterDiscount = Math.max(0, subtotal - discount);
            const tax = afterDiscount * CONFIG.taxRate;
            const total = afterDiscount + tax;
            const customerId = $('posCustomer')?.value || '';

            const sale = {
                id: generateId(),
                invoiceNo: 'INV-' + Date.now().toString().slice(-6),
                items: [...posCart],
                subtotal,
                discount,
                tax,
                total,
                customerId,
                date: new Date().toISOString(),
                user: currentUser?.user_metadata?.full_name || 'المدير',
                type: 'pos'
            };

            const sales = JSON.parse(localStorage.getItem('erp_sales') || '[]');
            sales.push(sale);
            localStorage.setItem('erp_sales', JSON.stringify(sales));

            const products = JSON.parse(localStorage.getItem('erp_products') || '[]');
            posCart.forEach(item => {
                const p = products.find(x => x.id === item.productId);
                if (p) p.stock = Math.max(0, (p.stock || 0) - item.qty);
            });
            localStorage.setItem('erp_products', JSON.stringify(products));

            const trans = JSON.parse(localStorage.getItem('erp_transactions') || '[]');
            trans.push({
                id: generateId(),
                type: 'income',
                amount: total,
                description: 'فاتورة بيع ' + sale.invoiceNo,
                date: sale.date,
                category: 'مبيعات'
            });
            localStorage.setItem('erp_transactions', JSON.stringify(trans));

            logActivity(`بيع: ${sale.invoiceNo} - ${fmt(total)}`);
            posCart = [];
            toast(`✅ تم البيع! فاتورة ${sale.invoiceNo}`, 'success');
            renderPOS();
        }

        function openProductModal(id) {
            const products = JSON.parse(localStorage.getItem('erp_products') || '[]');
            const p = id ? products.find(x => x.id === id) : {};
            const body = `
                <div class="form-group"><label>اسم المنتج *</label><input class="form-control" id="pName" value="${p.name||''}"></div>
                <div class="form-row">
                    <div class="form-group"><label>الباركود</label><input class="form-control" id="pBarcode" value="${p.barcode||''}"></div>
                    <div class="form-group"><label>الفئة</label><input class="form-control" id="pCategory" value="${p.category||''}"></div>
                </div>
                <div class="form-row">

                    <div class="form-group"><label>سعر البيع</label><input type="number" class="form-control" id="pPrice" step="0.01" value="${p.price||0}"></div>
                </div>

                    <div class="form-group"><label>الكمية</label><input type="number" class="form-control" id="pStock" value="${p.stock||0}"></div>

                </div>

            `;
            openModal(id ? 'تعديل منتج' : 'إضافة منتج', body,
                `<button class="btn btn-primary" onclick="saveProduct('${id||''}')">💾 حفظ</button><button class="btn btn-outline" onclick="closeModal()">إلغاء</button>`
            );
        }

        function saveProduct(id) {
            const name = $('pName').value.trim();
            if (!name) return toast('اسم المنتج مطلوب', 'warning');

            const data = {
                name,
                barcode: $('pBarcode').value.trim(),
                category: $('pCategory').value.trim() || 'عام',
                cost: Number($('pCost').value) || 0,
                price: Number($('pPrice').value) || 0,
                stock: Number($('pStock').value) || 0,
                minStock: Number($('pMinStock').value) || 5,
                description: $('pDesc').value.trim()
            };

            const products = JSON.parse(localStorage.getItem('erp_products') || '[]');
            if (id) {
                const idx = products.findIndex(x => x.id === id);
                if (idx >= 0) Object.assign(products[idx], data);
                logActivity('تعديل منتج: ' + name);
            } else {
                data.id = generateId();
                data.createdAt = new Date().toISOString();
                products.push(data);
                logActivity('إضافة منتج: ' + name);
            }
            localStorage.setItem('erp_products', JSON.stringify(products));
            closeModal();
            renderInventory();
            toast('✅ تم حفظ المنتج', 'success');
        }

        function deleteProduct(id) {
            if (!confirm('حذف المنتج؟')) return;
            let products = JSON.parse(localStorage.getItem('erp_products') || '[]');
            const p = products.find(x => x.id === id);
            products = products.filter(x => x.id !== id);
            localStorage.setItem('erp_products', JSON.stringify(products));
            logActivity('حذف منتج: ' + (p ? p.name : id));
            renderInventory();
            toast('🗑️ تم الحذف', 'info');
        }

        function exportInventory() {
            const products = JSON.parse(localStorage.getItem('erp_products') || '[]');
            const headers = ['المنتج', 'الباركود', 'الفئة', 'سعر الشراء', 'سعر البيع', 'المخزون', 'الحد الأدنى'];
            let csv = '\uFEFF' + headers.join(',') + '\n';
            products.forEach(p => {
                csv += [p.name, p.barcode || '', p.category || '', p.cost || 0, p.price || 0, p.stock || 0, p
                    .minStock || 0
                ].join(',') + '\n';
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'inventory_export.csv';
            a.click();
            URL.revokeObjectURL(url);
            toast('📥 تم تصدير المخزون', 'success');
        }

        function saveGeneric(type, id) {
            const name = $('gName').value.trim();
            if (!name) return toast('الاسم مطلوب', 'warning');

            const data = { name, phone: $('gPhone').value.trim(), email: $('gEmail').value.trim() };

            if (type === 'employees') {
                data.position = $('gPos').value.trim();
                data.department = $('gDept').value.trim();
                data.salary = Number($('gSalary').value) || 0;
                data.hireDate = $('gHireDate').value;
                data.active = $('gActive').value === 'true';
            } else {
                data.address = $('gAddr').value.trim();
                data.balance = Number($('gBalance').value) || 0;
                if (type === 'customers') {
                    data.creditLimit = Number($('gCredit').value) || 0;
                }
            }

            const items = JSON.parse(localStorage.getItem(`erp_${type}`) || '[]');
            if (id) {
                const idx = items.findIndex(x => x.id === id);
                if (idx >= 0) Object.assign(items[idx], data);
                logActivity('تعديل ' + type.slice(0, -1) + ': ' + name);
            } else {
                data.id = generateId();
                data.createdAt = new Date().toISOString();
                items.push(data);
                logActivity('إضافة ' + type.slice(0, -1) + ': ' + name);
            }
            localStorage.setItem(`erp_${type}`, JSON.stringify(items));
            closeModal();
            if (type === 'customers') renderCustomers();
            else if (type === 'suppliers') renderSuppliers();
            else renderEmployees();
            toast('✅ تم الحفظ', 'success');
        }

        function deleteGeneric(type, id) {
            if (!confirm('حذف هذا السجل؟')) return;
            let items = JSON.parse(localStorage.getItem(`erp_${type}`) || '[]');
            const item = items.find(x => x.id === id);
            items = items.filter(x => x.id !== id);
            localStorage.setItem(`erp_${type}`, JSON.stringify(items));
            logActivity('حذف ' + type.slice(0, -1) + ': ' + (item ? item.name : id));
            if (type === 'customers') renderCustomers();
            else if (type === 'suppliers') renderSuppliers();
            else renderEmployees();
            toast('🗑️ تم الحذف', 'info');
        }

        function quickSale() {
            const customers = JSON.parse(localStorage.getItem('erp_customers') || '[]');
            const products = JSON.parse(localStorage.getItem('erp_products') || '[]');

            let body = `
                <div class="form-group"><label>العميل</label><select id="qsCustomer" class="form-control"><option value="">-- نقدي --</option>
                    ${customers.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
                <div class="form-row"><div class="form-group"><label>المنتج</label><select id="qsProduct" class="form-control">
                    ${products.map(p => `<option value="${p.id}">${p.name} (${fmt(p.price)})</option>`).join('')}</select></div>
                    <div class="form-group"><label>الكمية</label><input type="number" id="qsQty" class="form-control" value="1" min="1"></div></div>
                <div class="form-group"><label>الخصم</label><input type="number" id="qsDiscount" class="form-control" value="0" step="0.01"></div>
            `;
            openModal('بيع سريع', body,
                `<button class="btn btn-success" onclick="saveQuickSale()">✅ إتمام البيع</button><button class="btn btn-outline" onclick="closeModal()">إلغاء</button>`
            );
        }

        function saveQuickSale() {
            const productId = $('qsProduct').value;
            const qty = Number($('qsQty').value) || 1;
            const discount = Number($('qsDiscount').value) || 0;
            const customerId = $('qsCustomer').value;

            const products = JSON.parse(localStorage.getItem('erp_products') || '[]');
            const p = products.find(x => x.id === productId);
            if (!p) return toast('المنتج غير موجود', 'error');
            if ((p.stock || 0) < qty) return toast('المخزون غير كافٍ', 'warning');

            const subtotal = p.price * qty;
            const afterDiscount = Math.max(0, subtotal - discount);
            const tax = afterDiscount * CONFIG.taxRate;
            const total = afterDiscount + tax;

            const sale = {
                id: generateId(),
                invoiceNo: 'INV-' + Date.now().toString().slice(-6),
                items: [{ productId: p.id, name: p.name, qty, price: p.price, total: p.price * qty }],
                subtotal,
                discount,
                tax,
                total,
                customerId,
                date: new Date().toISOString(),
                user: currentUser?.user_metadata?.full_name || 'المدير',
                type: 'quick'
            };

            const sales = JSON.parse(localStorage.getItem('erp_sales') || '[]');
            sales.push(sale);
            localStorage.setItem('erp_sales', JSON.stringify(sales));

            p.stock = Math.max(0, p.stock - qty);
            localStorage.setItem('erp_products', JSON.stringify(products));

            const trans = JSON.parse(localStorage.getItem('erp_transactions') || '[]');
            trans.push({
                id: generateId(),
                type: 'income',
                amount: total,
                description: 'بيع سريع ' + sale.invoiceNo,
                date: sale.date,
                category: 'مبيعات'
            });
            localStorage.setItem('erp_transactions', JSON.stringify(trans));

            logActivity('بيع سريع: ' + sale.invoiceNo + ' - ' + fmt(total));
            closeModal();
            renderSales();
            toast('✅ تم البيع بنجاح! ' + sale.invoiceNo, 'success');
        }

        function openPurchaseModal() {
            const suppliers = JSON.parse(localStorage.getItem('erp_suppliers') || '[]');
            const products = JSON.parse(localStorage.getItem('erp_products') || '[]');

            let body = `
                <div class="form-row"><div class="form-group"><label>المورد</label><select id="puSup" class="form-control">${suppliers.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}</select></div>

                <div class="form-group"><label>سعر الوحدة</label><input type="number" id="puPrice" class="form-control" step="0.01"></div>
            `;
            openModal('فاتورة شراء', body,

            );
        }

        function savePurchase() {
            const prodId = $('puProd').value;
            const qty = Number($('puQty').value) || 1;
            const price = Number($('puPrice').value) || 0;
            if (!prodId || qty <= 0 || price <= 0) return toast('بيانات غير صحيحة', 'warning');

            const products = JSON.parse(localStorage.getItem('erp_products') || '[]');
            const p = products.find(x => x.id === prodId);
            const total = qty * price;

            const purchase = {
                id: generateId(),
                invoiceNo: 'PUR-' + Date.now().toString().slice(-6),
                supplierId: $('puSup').value,
                date: $('puDate').value || new Date().toISOString(),
                items: [{ productId: prodId, name: p.name, qty, price, total }],
                total,
                status: 'paid',
                user: currentUser?.user_metadata?.full_name || 'المدير'
            };

            const purchases = JSON.parse(localStorage.getItem('erp_purchases') || '[]');
            purchases.push(purchase);
            localStorage.setItem('erp_purchases', JSON.stringify(purchases));

            if (p) p.stock = (p.stock || 0) + qty;
            localStorage.setItem('erp_products', JSON.stringify(products));

            const trans = JSON.parse(localStorage.getItem('erp_transactions') || '[]');
            trans.push({
                id: generateId(),
                type: 'expense',
                amount: total,
                description: 'شراء ' + p.name,
                date: purchase.date,
                category: 'مشتريات'
            });
            localStorage.setItem('erp_transactions', JSON.stringify(trans));

            logActivity('شراء: ' + purchase.invoiceNo + ' - ' + fmt(total));
            closeModal();
            renderPurchases();
            toast('✅ تم حفظ الشراء', 'success');
        }

        function deletePurchase(id) {
            if (!confirm('حذف الفاتورة؟')) return;
            let purchases = JSON.parse(localStorage.getItem('erp_purchases') || '[]');
            purchases = purchases.filter(x => x.id !== id);
            localStorage.setItem('erp_purchases', JSON.stringify(purchases));
            renderPurchases();
            toast('🗑️ تم الحذف', 'info');
        }

            const items = JSON.parse(localStorage.getItem('erp_assets') || '[]');

                    <div class="form-group"><label>الحالة</label><select class="form-control" id="aStatus">
                        <option value="active" ${a.status==='active'?'selected':''}>نشط</option>

                <div class="form-row"><div class="form-group"><label>العمر الافتراضي (سنوات)</label><input type="number" class="form-control" id="aLife" value="${a.usefulLife||5}"></div>
                    <div class="form-group"><label>تاريخ الشراء</label><input type="date" class="form-control" id="aDate" value="${a.purchaseDate||''}"></div></div>
                <div class="form-group"><label>الموقع</label><input class="form-control" id="aLocation" value="${a.location||''}"></div>
            `;

            );
        }

        function saveAsset(id) {
            const name = $('aName').value.trim();
            if (!name) return toast('اسم الأصل مطلوب', 'warning');

            const data = {
                name,
                category: $('aCategory').value,
                status: $('aStatus').value,
                cost: Number($('aCost').value) || 0,
                salvage: Number($('aSalvage').value) || 0,
                usefulLife: Number($('aLife').value) || 5,
                purchaseDate: $('aDate').value,
                location: $('aLocation').value.trim()
            };

            const items = JSON.parse(localStorage.getItem('erp_assets') || '[]');
            if (id) {
                const idx = items.findIndex(x => x.id === id);
                if (idx >= 0) Object.assign(items[idx], data);
                logActivity('تعديل أصل: ' + name);
            } else {
                data.id = generateId();
                data.createdAt = new Date().toISOString();
                items.push(data);
                logActivity('إضافة أصل: ' + name);
            }
            localStorage.setItem('erp_assets', JSON.stringify(items));
            closeModal();
            renderAssets();
            toast('✅ تم حفظ الأصل', 'success');
        }

        function deleteAsset(id) {
            if (!confirm('حذف الأصل؟')) return;
            let items = JSON.parse(localStorage.getItem('erp_assets') || '[]');
            const a = items.find(x => x.id === id);
            items = items.filter(x => x.id !== id);
            localStorage.setItem('erp_assets', JSON.stringify(items));
            logActivity('حذف أصل: ' + (a ? a.name : id));
            renderAssets();
            toast('🗑️ تم الحذف', 'info');
        }

        // =============================================
        // 18. WORKFLOWS
        // =============================================
        function renderWorkflows() {
            const workflows = JSON.parse(localStorage.getItem('erp_workflows') || '[]');
            let html = `<div class="toolbar"><button class="btn btn-primary" onclick="openWorkflowModal()">➕ طلب جديد</button></div>`;
            if (workflows.length === 0) {
                html +=
                    `<div class="card"><div class="card-body"><div class="empty-state"><div class="icon">⚙️</div><h3>لا توجد طلبات</h3></div></div></div>`;
            } else {
                const statusColors = { pending: 'warning', approved: 'success', rejected: 'danger' };
                const statusLabels = { pending: 'قيد المراجعة', approved: 'موافق عليه', rejected: 'مرفوض' };
                workflows.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(w => {
                    const steps = w.steps || [];
                    const currentStep = steps.findIndex(s => s.status === 'pending');
                    html += `
                        <div class="card"><div class="card-body">
                            <div class="flex-between mb-10">
                                <div><span style="font-weight:700;">${w.title}</span> <span class="badge badge-${statusColors[w.status]||'info'}">${statusLabels[w.status]||w.status}</span></div>
                                <div class="btn-group">
                                    ${w.status==='pending' ? `
                                        <button class="btn btn-sm btn-success" onclick="approveWorkflow('${w.id}')">✅</button>
                                        <button class="btn btn-sm btn-danger" onclick="rejectWorkflow('${w.id}')">❌</button>
                                    ` : ''}
                                    <button class="btn btn-sm btn-danger" onclick="deleteWorkflow('${w.id}')">🗑️</button>
                                </div>
                            </div>
                            <div style="font-size:0.85em;color:var(--text2);">${w.description||''}<br>بواسطة: ${w.requestedBy} - ${fmtDate(w.date)}</div>
                            <div style="display:flex;gap:5px;margin-top:10px;">
                                ${steps.map((s,i) => {
                                    let cls = '';
                                    if(s.status==='approved') cls='done';
                                    else if(s.status==='rejected') cls='';
                                    else if(i===currentStep) cls='current';
                                    return `<div style="flex:1;height:6px;border-radius:3px;background:${cls==='done'?'var(--secondary)':cls==='current'?'var(--warning)':'var(--border)'};" title="${s.label||''}"></div>`;
                                }).join('')}
                            </div>
                        </div></div>
                    `;
                });
            }
            $('pageContent').innerHTML = html;
        }

        function openWorkflowModal() {
            let body = `
                <div class="form-group"><label>عنوان الطلب *</label><input class="form-control" id="wfTitle"></div>
                <div class="form-group"><label>الوصف</label><textarea class="form-control" id="wfDesc"></textarea></div>
                <div class="form-group"><label>النوع</label><select class="form-control" id="wfType">
                    ${['طلب شراء','طلب إجازة','طلب سفر','طلب ميزانية','أخرى'].map(t => `<option>${t}</option>`).join('')}</select></div>
                <div class="form-group"><label>عدد مراحل الموافقة</label><input type="number" class="form-control" id="wfSteps" value="2" min="1" max="5"></div>
            `;
            openModal('طلب موافقة جديد', body,
                `<button class="btn btn-primary" onclick="saveWorkflow()">💾 إرسال</button><button class="btn btn-outline" onclick="closeModal()">إلغاء</button>`
            );
        }

        function saveWorkflow() {
            const title = $('wfTitle').value.trim();
            if (!title) return toast('عنوان الطلب مطلوب', 'warning');

            const numSteps = Number($('wfSteps').value) || 2;
            const steps = [];
            for (let i = 0; i < numSteps; i++) {
                steps.push({ label: 'مرحلة ' + (i + 1), status: i === 0 ? 'pending' : 'waiting' });
            }

            const wf = {
                id: generateId(),
                title,
                description: $('wfDesc').value.trim(),
                type: $('wfType').value,
                status: 'pending',
                steps,
                requestedBy: currentUser?.user_metadata?.full_name || 'المدير',
                date: new Date().toISOString()
            };

            const items = JSON.parse(localStorage.getItem('erp_workflows') || '[]');
            items.push(wf);
            localStorage.setItem('erp_workflows', JSON.stringify(items));
            logActivity('طلب موافقة: ' + title);
            closeModal();
            renderWorkflows();
            toast('✅ تم إرسال الطلب', 'success');
        }

        function approveWorkflow(id) {
            const items = JSON.parse(localStorage.getItem('erp_workflows') || '[]');
            const w = items.find(x => x.id === id);
            if (!w) return;

            const currentStep = (w.steps || []).find(s => s.status === 'pending');
            if (currentStep) {
                currentStep.status = 'approved';
                currentStep.approvedBy = currentUser?.user_metadata?.full_name || 'المدير';
                currentStep.approvedAt = new Date().toISOString();
                const nextStep = w.steps.find(s => s.status === 'waiting');
                if (nextStep) nextStep.status = 'pending';
                else w.status = 'approved';
            }
            localStorage.setItem('erp_workflows', JSON.stringify(items));
            logActivity('موافقة على: ' + w.title);
            renderWorkflows();
            toast('✅ تمت الموافقة', 'success');
        }

        function rejectWorkflow(id) {
            if (!confirm('رفض هذا الطلب؟')) return;
            const items = JSON.parse(localStorage.getItem('erp_workflows') || '[]');
            const w = items.find(x => x.id === id);
            if (!w) return;
            w.status = 'rejected';
            const currentStep = (w.steps || []).find(s => s.status === 'pending');
            if (currentStep) {
                currentStep.status = 'rejected';
                currentStep.rejectedBy = currentUser?.user_metadata?.full_name || 'المدير';
            }
            localStorage.setItem('erp_workflows', JSON.stringify(items));
            logActivity('رفض طلب: ' + w.title);
            renderWorkflows();
            toast('❌ تم الرفض', 'info');
        }

        function deleteWorkflow(id) {
            if (!confirm('حذف الطلب؟')) return;
            let items = JSON.parse(localStorage.getItem('erp_workflows') || '[]');
            items = items.filter(x => x.id !== id);
            localStorage.setItem('erp_workflows', JSON.stringify(items));
            renderWorkflows();
            toast('🗑️ تم الحذف', 'info');
        }

                    <div class="stat-card" style="cursor:pointer;" onclick="generateReport('employees')"><div class="stat-icon cyan">👔</div><div class="stat-info"><h3>تقرير الموظفين</h3></div></div>

        function generateReport(type) {
            let data = [],
                headers = [],
                title = '';
            if (type === 'sales') {
                title = 'تقرير المبيعات';
                headers = ['الفاتورة', 'التاريخ', 'الإجمالي'];
                JSON.parse(localStorage.getItem('erp_sales') || '[]').forEach(s => data.push([s.invoiceNo, s.date, s
                .total]));
            } else if (type === 'inventory') {
                title = 'تقرير المخزون';
                headers = ['المنتج', 'الفئة', 'المخزون', 'السعر'];
                JSON.parse(localStorage.getItem('erp_products') || '[]').forEach(p => data.push([p.name, p.category, p
                    .stock, p.price
                ]));
            } else if (type === 'financial') {
                title = 'التقرير المالي';
                headers = ['التاريخ', 'النوع', 'المبلغ'];
                JSON.parse(localStorage.getItem('erp_transactions') || '[]').forEach(t => data.push([t.date, t.type, t
                    .amount
                ]));
            } else if (type === 'employees') {
                title = 'تقرير الموظفين';
                headers = ['الاسم', 'المنصب', 'الراتب', 'الحالة'];
                JSON.parse(localStorage.getItem('erp_employees') || '[]').forEach(e => data.push([e.name, e.position, e
                    .salary, e.active !== false ? 'نشط' : 'غير نشط'
                ]));
            }

            let html =
                `<div class="card"><div class="card-header"><h3>${title}</h3><button class="btn btn-sm btn-success" onclick="exportReport('${type}')">📥 تصدير CSV</button></div><div class="card-body no-pad"><div class="table-responsive"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`;
            if (data.length === 0) {
                html +=
                    `<tr><td colspan="${headers.length}" class="text-center" style="padding:30px;">لا توجد بيانات</td></tr>`;
            } else {
                data.forEach(row => html += `<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`);
            }
            html += `</tbody></table></div></div></div>`;
            $('reportOutput').innerHTML = html;
        }

        function exportReport(type) {
            let data = [],
                headers = [];
            if (type === 'sales') {
                headers = ['الفاتورة', 'التاريخ', 'الإجمالي'];
                JSON.parse(localStorage.getItem('erp_sales') || '[]').forEach(s => data.push([s.invoiceNo, s.date, s
                .total]));
            } else if (type === 'inventory') {
                headers = ['المنتج', 'الفئة', 'المخزون', 'السعر'];
                JSON.parse(localStorage.getItem('erp_products') || '[]').forEach(p => data.push([p.name, p.category, p
                    .stock, p.price
                ]));
            } else if (type === 'financial') {
                headers = ['التاريخ', 'النوع', 'المبلغ'];
                JSON.parse(localStorage.getItem('erp_transactions') || '[]').forEach(t => data.push([t.date, t.type, t
                    .amount
                ]));
            } else if (type === 'employees') {
                headers = ['الاسم', 'المنصب', 'الراتب'];
                JSON.parse(localStorage.getItem('erp_employees') || '[]').forEach(e => data.push([e.name, e.position, e
                    .salary
                ]));
            }

            let csv = '\uFEFF' + headers.join(',') + '\n';
            data.forEach(row => { csv += row.join(',') + '\n'; });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${type}_report.csv`;
            a.click();
            URL.revokeObjectURL(url);
            logActivity('تصدير تقرير: ' + type);
            toast('📥 تم تصدير التقرير', 'success');
        }

        function resetSystem() {
            if (!confirm('⚠️ تحذير: سيتم حذف جميع البيانات نهائياً!')) return;

        function openUserModal() {
            let body = `
                <div class="form-group"><label>الاسم الكامل *</label><input class="form-control" id="uName"></div>
                <div class="form-group"><label>البريد الإلكتروني *</label><input type="email" class="form-control" id="uEmail"></div>

        function saveUser() {
            const name = $('uName').value.trim();
            const email = $('uEmail').value.trim();
            const pass = $('uPass').value;
            const role = $('uRole').value;
            const company = $('uComp').value.trim();

            if (!name || !email || !pass) return toast('جميع الحقول مطلوبة', 'warning');

            const users = JSON.parse(localStorage.getItem('erp_users') || '[]');
            if (users.find(u => u.email === email)) return toast('هذا البريد مسجل بالفعل', 'error');

            users.push({
                id: generateId(),
                name,
                email,
                password: pass,
                role,
                company: company || 'شركتي',
                createdAt: new Date().toISOString()
            });
            localStorage.setItem('erp_users', JSON.stringify(users));
            logActivity('إضافة مستخدم: ' + name);
            closeModal();
            renderUsers();
            toast('✅ تم إضافة المستخدم', 'success');
        }

        function deleteUser(id) {
            if (!confirm('حذف المستخدم؟')) return;
            if (id === currentUser?.id) return toast('لا يمكن حذف نفسك', 'warning');
            let users = JSON.parse(localStorage.getItem('erp_users') || '[]');
            const u = users.find(x => x.id === id);
            users = users.filter(x => x.id !== id);
            localStorage.setItem('erp_users', JSON.stringify(users));
            logActivity('حذف مستخدم: ' + (u ? u.name : id));
            renderUsers();
            toast('🗑️ تم الحذف', 'info');
        }

        // =============================================
        // 23. BRANCHES MANAGEMENT
        // =============================================
        function renderBranches() {
            if (!hasPermission('branches')) {
                $('pageContent').innerHTML = `<div class="card"><div class="card-body"><div class="empty-state"><div class="icon">🔒</div><h3>ليس لديك صلاحية</h3></div></div></div>`;
                return;
            }
            const branches = JSON.parse(localStorage.getItem('erp_branches') || '[]');
            let html = `
                <div class="toolbar"><button class="btn btn-primary" onclick="openBranchModal()">➕ إضافة فرع</button></div>
                <div class="card"><div class="card-body no-pad"><div class="table-responsive">
                    <table><thead><tr><th>#</th><th>الفرع</th><th>الموقع</th><th>الهاتف</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>
            `;
            if (branches.length === 0) {
                html +=
                    `<tr><td colspan="6" class="text-center" style="padding:40px;"><div class="empty-state"><div class="icon">🏬</div><h3>لا توجد فروع</h3></div></td></tr>`;
            } else {
                branches.forEach((b, i) => {
                    html += `<tr>
                        <td>${i+1}</td>
                        <td><strong>${b.name}</strong></td>
                        <td>${b.location||'-'}</td>
                        <td>${b.phone||'-'}</td>
                        <td><span class="badge badge-${b.active!==false?'success':'danger'}">${b.active!==false?'نشط':'غير نشط'}</span></td>
                        <td><div class="btn-group">
                            <button class="btn btn-sm btn-info" onclick="openBranchModal('${b.id}')">✏️</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteBranch('${b.id}')">🗑️</button>
                        </div></td>
                    </tr>`;
                });
            }
            html += `</tbody></table></div></div></div>`;
            $('pageContent').innerHTML = html;
        }

        function openBranchModal(id) {
            const items = JSON.parse(localStorage.getItem('erp_branches') || '[]');
            const b = id ? items.find(x => x.id === id) : {};
            let body = `
                <div class="form-group"><label>اسم الفرع *</label><input class="form-control" id="bName" value="${b.name||''}"></div>
                <div class="form-group"><label>الموقع</label><input class="form-control" id="bLoc" value="${b.location||''}"></div>
                <div class="form-group"><label>الهاتف</label><input class="form-control" id="bPhone" value="${b.phone||''}"></div>
                <div class="form-group"><label>الحالة</label><select class="form-control" id="bActive">
                    <option value="true" ${b.active!==false?'selected':''}>نشط</option>
                    <option value="false" ${b.active===false?'selected':''}>غير نشط</option>
                </select></div>
            `;
            openModal(id ? 'تعديل فرع' : 'إضافة فرع', body,
                `<button class="btn btn-primary" onclick="saveBranch('${id||''}')">💾 حفظ</button><button class="btn btn-outline" onclick="closeModal()">إلغاء</button>`
            );
        }

        function saveBranch(id) {
            const name = $('bName').value.trim();
            if (!name) return toast('اسم الفرع مطلوب', 'warning');

            const data = {
                name,
                location: $('bLoc').value.trim(),
                phone: $('bPhone').value.trim(),
                active: $('bActive').value === 'true'
            };

            const items = JSON.parse(localStorage.getItem('erp_branches') || '[]');
            if (id) {
                const idx = items.findIndex(x => x.id === id);
                if (idx >= 0) Object.assign(items[idx], data);
                logActivity('تعديل فرع: ' + name);
            } else {
                data.id = generateId();
                data.createdAt = new Date().toISOString();
                items.push(data);
                logActivity('إضافة فرع: ' + name);
            }
            localStorage.setItem('erp_branches', JSON.stringify(items));
            closeModal();
            renderBranches();
            toast('✅ تم حفظ الفرع', 'success');
        }

        function deleteBranch(id) {
            if (!confirm('حذف الفرع؟')) return;
            let items = JSON.parse(localStorage.getItem('erp_branches') || '[]');
            const b = items.find(x => x.id === id);
            items = items.filter(x => x.id !== id);
            localStorage.setItem('erp_branches', JSON.stringify(items));
            logActivity('حذف فرع: ' + (b ? b.name : id));
            renderBranches();
            toast('🗑️ تم الحذف', 'info');
        }

        // =============================================
        // 24. VIEW INVOICE
        // =============================================
        function viewInvoice(id, type) {
            const items = JSON.parse(localStorage.getItem(`erp_${type}`) || '[]');
            const inv = items.find(x => x.id === id);
            if (!inv) return;

            const company = localStorage.getItem('erp_company') || 'الشركة';
            let body = `
                <div style="background:#fff;color:#000;padding:30px;border:1px solid #eee;">
                    <h2 style="text-align:center;margin-bottom:20px;">${company}</h2>
                    <p class="text-center"><strong>فاتورة ${type === 'sales' ? 'بيع' : 'شراء'}</strong> - ${inv.invoiceNo}</p>
                    <p class="text-center">التاريخ: ${fmtDate(inv.date)}</p>
                    <hr style="margin:15px 0;">
                    <table style="width:100%;border-collapse:collapse;margin-bottom:20px;">
                        <thead><tr style="background:#f8f8f8;"><th style="border:1px solid #ddd;padding:8px;">المنتج</th><th style="border:1px solid #ddd;padding:8px;">الكمية</th><th style="border:1px solid #ddd;padding:8px;">السعر</th><th style="border:1px solid #ddd;padding:8px;">الإجمالي</th></tr></thead>
                        <tbody>${(inv.items||[]).map(i => `<tr><td style="border:1px solid #ddd;padding:8px;">${i.name}</td><td style="border:1px solid #ddd;padding:8px;">${i.qty}</td><td style="border:1px solid #ddd;padding:8px;">${fmt(i.price)}</td><td style="border:1px solid #ddd;padding:8px;">${fmt(i.qty*i.price)}</td></tr>`).join('')}</tbody>
                    </table>
                    <div style="text-align:left;font-weight:bold;font-size:1.2em;">الإجمالي: ${fmt(inv.total)}</div>
                </div>
            `;
            openModal('عرض الفاتورة', body,
                `<button class="btn btn-primary" onclick="window.print()">🖨️ طباعة</button><button class="btn btn-outline" onclick="closeModal()">إغلاق</button>`,
                '800px'
            );
        }

        // =============================================
        // 25. FILTER HELPERS
        // =============================================
        function filterTable(input, tableId) {
            const q = input.value.toLowerCase();
            const rows = document.querySelectorAll(`#${tableId} tbody tr`);
            rows.forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
            });
        }

        // =============================================
        // 26. BOOTSTRAP
        // =============================================
        window.onload = checkAuth;

        // =============================================
        // 27. GLOBAL EXPOSURE
        // =============================================
        window.navigate = navigate;
        window.toggleSidebar = toggleSidebar;
        window.toggleTheme = toggleTheme;
        window.doLogin = doLogin;
        window.doRegister = doRegister;
        window.doLogout = doLogout;
        window.showRegister = showRegister;
        window.showLogin = showLogin;
        window.closeModal = closeModal;
        window.openModal = openModal;

        // POS
        window.addToCart = addToCart;
        window.changeQty = changeQty;
        window.removeFromCart = removeFromCart;
        window.clearCart = clearCart;
        window.completeSale = completeSale;
        window.updateCart = updateCart;
        window.filterPOS = filterPOS;

        // CRUD
        window.openProductModal = openProductModal;
        window.saveProduct = saveProduct;
        window.deleteProduct = deleteProduct;
        window.openGenericModal = openGenericModal;
        window.saveGeneric = saveGeneric;
        window.deleteGeneric = deleteGeneric;
        window.openPurchaseModal = openPurchaseModal;
        window.savePurchase = savePurchase;
        window.deletePurchase = deletePurchase;
        window.openProjectModal = openProjectModal;
        window.saveProject = saveProject;
        window.deleteProject = deleteProject;
        window.openAssetModal = openAssetModal;
        window.saveAsset = saveAsset;
        window.deleteAsset = deleteAsset;
        window.openTransModal = openTransModal;
        window.saveTrans = saveTrans;
        window.deleteTrans = deleteTrans;
        window.openWorkflowModal = openWorkflowModal;
        window.saveWorkflow = saveWorkflow;
        window.approveWorkflow = approveWorkflow;
        window.rejectWorkflow = rejectWorkflow;
        window.deleteWorkflow = deleteWorkflow;
        window.openUserModal = openUserModal;
        window.saveUser = saveUser;
        window.deleteUser = deleteUser;
        window.openBranchModal = openBranchModal;
        window.saveBranch = saveBranch;
        window.deleteBranch = deleteBranch;

        // Reports
        window.generateReport = generateReport;
        window.exportReport = exportReport;
        window.viewInvoice = viewInvoice;
        window.quickSale = quickSale;
        window.saveQuickSale = saveQuickSale;

        // Settings
        window.saveSettings = saveSettings;
        window.resetSystem = resetSystem;
        window.clearActivity = clearActivity;
        window.filterTable = filterTable;
        window.exportInventory = exportInventory;
    </script>
</body>
</html>
