<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Pro MAX | نظام إدارة الأعمال المتكامل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#6c5ce7;--accent2:#a29bfe;
  --bg:#0a0d14;--bg2:#0f1320;--card:#141927;--card2:#1a2138;
  --border:#1e2a42;--text:#e8ecf5;--muted:#7a8599;
  --success:#00b894;--danger:#ff5e6c;--warning:#fdcb6e;--info:#0984e3;
  --radius:14px;--shadow:0 12px 40px rgba(0,0,0,.4);
  --side-w:270px;--topbar-h:64px;
  --grad:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#000));
}
body.light{--bg:#f0f2f8;--bg2:#e8ebf3;--card:#fff;--card2:#f7f8fc;--border:#dde2ee;--text:#1a2138;--muted:#5f6b82;--shadow:0 8px 30px rgba(30,40,80,.08)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(800px 400px at 90% -10%,color-mix(in srgb,var(--accent) 12%,transparent),transparent),
  radial-gradient(600px 400px at 5% 110%,color-mix(in srgb,var(--accent) 7%,transparent),transparent)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;background:var(--bg2);color:var(--text);border:1.5px solid var(--border);border-radius:calc(var(--radius) - 5px);padding:11px 14px;font-size:.9rem;width:100%;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
label{font-size:.78rem;color:var(--muted);font-weight:700;display:block;margin-bottom:5px}
.hidden{display:none!important}

/* ===== شاشة الدخول ===== */
#loginScreen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#loginScreen::before{content:'';position:absolute;inset:0;background:
  radial-gradient(900px 500px at 80% 20%,color-mix(in srgb,var(--accent) 15%,transparent),transparent),
  radial-gradient(700px 400px at 20% 80%,color-mix(in srgb,var(--accent) 10%,transparent),transparent)}
.login-box{position:relative;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:44px 40px;width:100%;max-width:420px;box-shadow:var(--shadow);animation:pop .4s}
.login-box .logo-big{width:72px;height:72px;border-radius:20px;background:var(--grad);display:grid;place-items:center;font-size:2rem;color:#fff;margin:0 auto 20px;box-shadow:0 12px 30px color-mix(in srgb,var(--accent) 40%,transparent)}
.login-box h1{text-align:center;font-size:1.4rem;font-weight:900;margin-bottom:6px}
.login-box p{text-align:center;color:var(--muted);font-size:.82rem;margin-bottom:26px}
.login-box .frm{display:grid;gap:16px}
.login-box .btn-login{width:100%;padding:14px;font-size:1rem;font-weight:800;border-radius:12px;color:#fff;background:var(--grad);transition:.2s;margin-top:6px}
.login-box .btn-login:hover{transform:translateY(-2px);box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 45%,transparent)}
.login-demo{text-align:center;margin-top:18px;font-size:.75rem;color:var(--muted)}
.login-demo span{cursor:pointer;color:var(--accent);font-weight:700;text-decoration:underline}

/* ===== الهيكل ===== */
#app{display:none;min-height:100vh;position:relative;z-index:1}
#app.show{display:flex}
.sidebar{width:var(--side-w);background:var(--bg2);border-inline-end:1px solid var(--border);position:fixed;inset-block:0;inset-inline-start:0;display:flex;flex-direction:column;z-index:50;transition:transform .3s}
.brand{display:flex;align-items:center;gap:12px;padding:18px;border-bottom:1px solid var(--border)}
.brand .logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:900;font-size:1.2rem;color:#fff;background:var(--grad);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 35%,transparent);flex-shrink:0}
.brand b{font-size:1rem;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:.68rem}
.nav{flex:1;overflow-y:auto;padding:10px}
.nav-section{font-size:.65rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:1px;padding:12px 14px 6px;margin-top:6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:calc(var(--radius) - 3px);color:var(--muted);font-weight:600;font-size:.86rem;margin-bottom:2px;transition:.2s;cursor:pointer;border:1px solid transparent;position:relative}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.active{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 20%,transparent),color-mix(in srgb,var(--accent) 7%,transparent));color:var(--text);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.nav-item .ico{font-size:1.05rem;width:24px;text-align:center}
.nav-item .badge{margin-inline-start:auto;background:var(--danger);color:#fff;font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:99px}
.side-foot{padding:12px;border-top:1px solid var(--border);font-size:.68rem;color:var(--muted);text-align:center}
.main{flex:1;margin-inline-start:var(--side-w);display:flex;flex-direction:column;min-width:0;min-height:100vh}

/* ===== الشريط العلوي ===== */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:0 22px;height:var(--topbar-h);background:color-mix(in srgb,var(--bg2) 85%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.hamb{display:none;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;width:38px;height:38px;font-size:1.05rem}
.ptitle{font-size:1rem;font-weight:800;white-space:nowrap}
.top-actions{margin-inline-start:auto;display:flex;align-items:center;gap:9px}
.icon-btn{position:relative;width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:1rem;display:grid;place-items:center;transition:.2s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.badge-dot{position:absolute;top:-4px;inset-inline-start:-4px;background:var(--danger);color:#fff;font-size:.58rem;font-weight:800;min-width:16px;height:16px;border-radius:99px;display:grid;place-items:center;padding:0 3px}
.user-chip{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:4px 12px 4px 4px;cursor:pointer;transition:.2s}
.user-chip:hover{border-color:var(--accent)}
.user-chip .av{width:30px;height:30px;border-radius:9px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;font-size:.8rem}
.user-chip .info{text-align:right}
.user-chip .info b{font-size:.76rem;display:block;line-height:1.2}
.user-chip .info small{font-size:.62rem;color:var(--muted)}
.rel{position:relative}
.drop-menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;min-width:220px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px;display:none;z-index:60}
.drop-menu.show{display:block}
.drop-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:9px;font-size:.82rem;font-weight:600;transition:.15s;cursor:pointer}
.drop-item:hover{background:var(--bg2)}
.drop-item.danger{color:var(--danger)}
.notif-panel{position:absolute;top:calc(100% + 8px);inset-inline-end:0;width:340px;max-height:400px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;display:none;z-index:60}
.notif-panel.show{display:block}
.notif-panel h4{font-size:.82rem;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.notif-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;font-size:.78rem;background:var(--bg2);margin-bottom:6px;border-inline-start:3px solid var(--accent)}
.notif-item.unread{background:color-mix(in srgb,var(--accent) 8%,var(--bg2))}
.notif-item .time{font-size:.65rem;color:var(--muted);margin-top:2px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45;display:none}
body.nav-open .overlay{display:block}
body.nav-open .sidebar{transform:none;box-shadow:var(--shadow)}

/* ===== المحتوى ===== */
.content{padding:24px;max-width:1440px;width:100%;margin-inline:auto;flex:1}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:.25s}
.card:hover{border-color:color-mix(in srgb,var(--accent) 30%,var(--border))}
.kpi{display:flex;gap:14px;align-items:center;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;inset-inline-end:-25px;top:-25px;width:100px;height:100px;border-radius:50%;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.kpi .ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:1.35rem;flex-shrink:0;background:color-mix(in srgb,var(--accent) 14%,transparent)}
.kpi h3{font-size:1.25rem;font-weight:800;line-height:1.2}
.kpi p{font-size:.75rem;color:var(--muted);font-weight:600}
.card h2{font-size:.95rem;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.cols-2{grid-template-columns:2fr 1fr}
.cols-3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:1.2rem;font-weight:900}
.page-head .sp{flex:1}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:.68rem;font-weight:700}
.tag.ok{background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success)}
.tag.bad{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.tag.warn{background:color-mix(in srgb,var(--warning) 16%,transparent);color:#b58a1b}
.tag.info{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
.tag.accent{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}

/* ===== الجداول ===== */
.table-wrap{overflow-x:auto;border-radius:calc(var(--radius) - 4px);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:.83rem;min-width:600px}
thead th{background:var(--bg2);color:var(--muted);font-size:.72rem;font-weight:700;padding:12px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border)}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr{transition:.15s}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 4%,transparent)}
tbody tr:last-child td{border-bottom:none}
.row-actions{display:flex;gap:5px}
.mini{width:31px;height:31px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:.82rem;transition:.2s;display:grid;place-items:center}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.mini.del:hover{border-color:var(--danger);color:var(--danger)}

/* ===== الأزرار ===== */
.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:calc(var(--radius) - 5px);padding:10px 18px;font-weight:700;font-size:.83rem;transition:.2s;color:#fff;background:var(--grad)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn.ghost:hover{border-color:var(--accent);box-shadow:none;color:var(--accent)}
.btn.danger{background:linear-gradient(135deg,var(--danger),#b8232f)}
.btn.success{background:linear-gradient(135deg,var(--success),#007a5e)}
.btn.sm{padding:7px 13px;font-size:.74rem;border-radius:9px}
.btn.xs{padding:5px 10px;font-size:.68rem;border-radius:7px}

/* ===== النوافذ ===== */
.modal{position:fixed;inset:0;background:rgba(4,6,12,.7);backdrop-filter:blur(6px);display:none;place-items:center;z-index:100;padding:16px}
.modal.show{display:grid}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius) + 6px);width:100%;max-width:680px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow);animation:pop .25s}
@keyframes pop{from{transform:translateY(20px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:2}
.modal-head h3{font-size:1rem;font-weight:800}
.modal-body{padding:22px}
.modal-foot{display:flex;gap:10px;padding:14px 22px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--card)}
.frm{display:grid;gap:14px}
.frm.c2{grid-template-columns:1fr 1fr}
.frm.c3{grid-template-columns:1fr 1fr 1fr}
.fg.full{grid-column:1/-1}

/* ===== POS ===== */
.pos-layout{display:grid;grid-template-columns:1fr 380px;gap:16px;height:calc(100vh - var(--topbar-h) - 48px)}
.pos-products{overflow-y:auto}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.pos-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:.2s}
.pos-item:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 20%,transparent)}
.pos-item .emoji{font-size:1.8rem;margin-bottom:6px}
.pos-item .name{font-size:.76rem;font-weight:700;margin-bottom:3px}
.pos-item .price{font-size:.82rem;font-weight:800;color:var(--accent)}
.pos-item .qty{font-size:.65rem;color:var(--muted)}
.pos-cart{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.pos-cart-head{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:800;font-size:.9rem;display:flex;justify-content:space-between;align-items:center}
.pos-cart-items{flex:1;overflow-y:auto;padding:12px}
.pos-cart-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--bg2);margin-bottom:8px;font-size:.8rem}
.pos-cart-item .qty-ctrl{display:flex;align-items:center;gap:6px}
.pos-cart-item .qty-ctrl button{width:24px;height:24px;border-radius:6px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:.75rem;display:grid;place-items:center}
.pos-cart-item .qty-ctrl span{font-weight:700;min-width:20px;text-align:center}
.pos-cart-item .total{margin-inline-start:auto;font-weight:800;color:var(--accent)}
.pos-cart-item .del-item{color:var(--danger);cursor:pointer;font-size:.9rem}
.pos-cart-foot{padding:16px 18px;border-top:1px solid var(--border)}
.pos-total{display:flex;justify-content:space-between;font-size:1.1rem;font-weight:900;margin-bottom:12px}
.pos-barcode{display:flex;gap:8px;margin-bottom:12px}
.pos-barcode input{flex:1;padding:9px 12px;font-size:.85rem}
.pos-barcode button{padding:9px 14px;font-size:.85rem}

/* ===== المشاريع ===== */
.proj-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;transition:.2s}
.proj-card:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--border));transform:translateY(-2px)}
.proj-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.proj-title{font-weight:800;font-size:.9rem}
.proj-desc{font-size:.75rem;color:var(--muted);margin-bottom:12px}
.proj-progress{height:7px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:10px 0}
.proj-progress .bar{height:100%;border-radius:99px;background:var(--grad);transition:width .5s}
.proj-meta{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted)}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

/* ===== سير العمل ===== */
.wf-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:10px;transition:.2s}
.wf-item:hover{border-color:color-mix(in srgb,var(--accent) 30%,var(--border))}
.wf-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.2rem;flex-shrink:0}
.wf-info{flex:1}
.wf-info b{font-size:.85rem;display:block}
.wf-info small{font-size:.72rem;color:var(--muted)}
.wf-status{font-size:.72rem;font-weight:700;padding:4px 12px;border-radius:99px}
.wf-status.pending{background:color-mix(in srgb,var(--warning) 15%,transparent);color:#b58a1b}
.wf-status.approved{background:color-mix(in srgb,var(--success) 15%,transparent);color:var(--success)}
.wf-status.rejected{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}

/* ===== سجل التدقيق ===== */
.audit-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);font-size:.8rem}
.audit-item:last-child{border-bottom:none}
.audit-dot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex-shrink:0}
.audit-item .time{font-size:.68rem;color:var(--muted)}

/* ===== إعدادات ===== */
.set-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));align-items:start}
.swatches{display:flex;gap:9px;flex-wrap:wrap;margin-top:4px}
.sw{width:34px;height:34px;border-radius:10px;cursor:pointer;border:2px solid transparent;transition:.2s}
.sw.on{border-color:#fff;transform:scale(1.12);box-shadow:0 0 0 2px var(--accent)}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);font-size:.85rem;font-weight:600}
.switch-row:last-child{border-bottom:none}
.switch{position:relative;width:46px;height:25px;flex-shrink:0}
.switch input{display:none}
.switch i{position:absolute;inset:0;background:var(--border);border-radius:99px;transition:.25s;cursor:pointer}
.switch i::after{content:'';position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;top:3px;inset-inline-start:3px;transition:.25s}
.switch input:checked + i{background:var(--accent)}
.switch input:checked + i::after{inset-inline-start:24px}
input[type=range]{padding:0;accent-color:var(--accent)}
input[type=color]{padding:3px;height:42px;width:55px;cursor:pointer}

/* ===== الفواتير ===== */
.inv-row{display:grid;grid-template-columns:2fr .7fr 1fr 36px;gap:8px;margin-bottom:8px;align-items:center}
.inv-row select,.inv-row input{padding:8px 10px;font-size:.82rem}
.ibtn{background:var(--bg2);border:1px solid var(--border);color:var(--danger);border-radius:9px;height:36px;display:grid;place-items:center}
.inv-sum{background:var(--bg2);border:1px solid var(--border);border-radius:calc(var(--radius) - 4px);padding:14px;margin-top:12px;font-size:.86rem}
.inv-sum .ln{display:flex;justify-content:space-between;margin-bottom:6px;color:var(--muted)}
.inv-sum .tot{font-size:1.05rem;font-weight:800;color:var(--text);border-top:1px dashed var(--border);padding-top:8px;margin-top:8px}

/* ===== التنبيهات ===== */
#toast{position:fixed;bottom:24px;inset-inline-start:50%;transform:translateX(50%) translateY(90px);z-index:200;background:var(--card);border:1px solid var(--border);border-inline-start:4px solid var(--success);border-radius:12px;padding:13px 22px;font-weight:700;font-size:.85rem;box-shadow:var(--shadow);transition:.35s;opacity:0;max-width:90vw}
#toast.show{transform:translateX(50%) translateY(0);opacity:1}
#toast.err{border-inline-start-color:var(--danger)}
.empty{text-align:center;padding:45px 20px;color:var(--muted)}
.empty .big{font-size:2.6rem;margin-bottom:8px}
canvas{width:100%;height:260px;display:block}
.search-box{position:relative;max-width:300px}
.search-box input{padding-inline-start:36px}
.search-box::before{content:'🔍';position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);font-size:.8rem;opacity:.5}

/* ===== تجاوب ===== */
@media(max-width:1024px){
  .cols-2{grid-template-columns:1fr}
  .pos-layout{grid-template-columns:1fr;height:auto}
  .pos-cart{max-height:400px}
}
@media(max-width:920px){
  .sidebar{transform:translateX(100%)}
  body.nav-open .sidebar{transform:none}
  .main{margin-inline-start:0}
  .hamb{display:grid;place-items:center}
  .frm.c2,.frm.c3{grid-template-columns:1fr}
  .user-chip .info{display:none}
  .inv-row{grid-template-columns:1.5fr .6fr 1fr 32px}
  .content{padding:16px}
}
@media print{.sidebar,.topbar,.page-head .btn,#toast{display:none!important}.main{margin:0}}
</style>
</head>
<body>

<!-- ===== شاشة الدخول ===== -->
<div id="loginScreen">
  <div class="login-box">
    <div class="logo-big">⚡</div>
    <h1>ERP Pro MAX</h1>
    <p>نظام إدارة الأعمال المتكامل — سجل دخولك للمتابعة</p>
    <div class="frm">
      <div><label>اسم المستخدم</label><input id="loginUser" placeholder="admin" autocomplete="off"></div>
      <div><label>كلمة المرور</label><input id="loginPass" type="password" placeholder="••••••" autocomplete="off"></div>
      <div><label>الفرع</label><select id="loginBranch"><option>الفرع الرئيسي</option><option>فرع الرياض</option><option>فرع جدة</option></select></div>
      <button class="btn-login" onclick="doLogin()">🔐 تسجيل الدخول</button>
    </div>
    <div class="login-demo">للتجربة: <span onclick="fillDemo()">admin / admin</span></div>
  </div>
</div>

<!-- ===== التطبيق ===== -->
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo" id="brandLogo">E</div>
      <div><b id="brandName">ERP Pro</b><small id="brandSub">نظام إدارة الأعمال</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">ERP Pro MAX v2.0 — <span id="footerUser"></span></div>
  </aside>
  <div class="overlay" onclick="toggleNav(false)"></div>

  <div class="main">
    <header class="topbar">
      <button class="hamb" onclick="toggleNav()">☰</button>
      <div class="ptitle" id="pageTitle">لوحة التحكم</div>
      <div class="top-actions">
        <div class="rel">
          <button class="icon-btn" onclick="toggleNotif(event)" title="الإشعارات">🔔<span class="badge-dot" id="notifBadge" style="display:none">0</span></button>
          <div class="notif-panel" id="notifPanel"></div>
        </div>
        <div class="rel">
          <button class="icon-btn" onclick="toggleTheme()" title="تبديل الثيم">🌙</button>
        </div>
        <div class="rel">
          <div class="user-chip" onclick="toggleUserMenu(event)">
            <div class="info"><b id="userName">المدير</b><small id="userRole">مدير النظام</small></div>
            <div class="av" id="userAv">M</div>
          </div>
          <div class="drop-menu" id="userMenu">
            <div class="drop-item" onclick="go('settings')">⚙️ الإعدادات</div>
            <div class="drop-item" onclick="go('audit')">📋 سجل النشاط</div>
            <div class="drop-item danger" onclick="doLogout()">🚪 تسجيل الخروج</div>
          </div>
        </div>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<!-- نافذة عامة -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head"><h3 id="mTitle"></h3><button class="mini" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="mBody"></div>
    <div class="modal-foot"><button class="btn" id="mOk">حفظ</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ================================================================
   ERP PRO MAX v2.0 — نظام إدارة موارد المؤسسات المتقدم
   البنية: Auth → DB → Utils → Theme → Nav → Pages → Charts
================================================================ */

// ===== المصادقة =====
// المستخدمون مخزّنون في DB.users (يتم إنشاؤهم في seedDB)
let CURRENT_USER = null;

function doLogin(){
  const u = $('#loginUser').value.trim();
  const p = $('#loginPass').value;
  // التأكد من وجود DB و users
  if (!DB || !DB.users) {
    toast('خطأ في تحميل البيانات، يرجى تحديث الصفحة', 'err');
    return;
  }
  const found = DB.users.find(x => x.user === u && x.pass === p);
  if(!found) return toast('بيانات الدخول غير صحيحة','err');
  CURRENT_USER = found;
  $('#loginScreen').style.display='none';
  $('#app').classList.add('show');
  $('#userName').textContent = found.name;
  $('#userRole').textContent = found.role === 'admin' ? 'مدير النظام' : found.role === 'manager' ? 'مدير' : found.role === 'accountant' ? 'محاسب' : 'موظف';
  $('#userAv').textContent = found.name.charAt(0);
  $('#footerUser').textContent = found.name;
  applyTheme();render();
  addAudit('تسجيل دخول','دخول النظام بنجاح');
  toast('مرحباً '+found.name+' 👋');
}

function fillDemo(){$('#loginUser').value='admin';$('#loginPass').value='admin';}
function doLogout(){CURRENT_USER = null;$('#app').classList.remove('show');$('#loginScreen').style.display='flex';$('#loginUser').value='';$('#loginPass').value='';}
$('#loginPass').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });

// ===== قاعدة البيانات =====
const LS = 'erp_pro_max_v2';
let DB = loadDB();
function loadDB(){
  try {
    const d = JSON.parse(localStorage.getItem(LS));
    if(d && d.settings) return d;
  } catch(e){}
  return null;
}
function saveDB(){ localStorage.setItem(LS, JSON.stringify(DB)); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const today = () => new Date().toISOString().slice(0,10);
const now = () => new Date().toISOString();

function seedDB(){
  // --- المستخدمون (مخزّنون في DB) ---
  const users = [
    { user: 'admin', pass: 'admin', name: 'مدير النظام', role: 'admin', branch: 'الفرع الرئيسي' },
    { user: 'manager', pass: '1234', name: 'مدير العمليات', role: 'manager', branch: 'فرع الرياض' },
    { user: 'accountant', pass: '1234', name: 'المحاسب', role: 'accountant', branch: 'الفرع الرئيسي' },
    { user: 'employee', pass: '1234', name: 'موظف مبيعات', role: 'employee', branch: 'فرع جدة' }
  ];

  const P = [
    {id:uid(), name:'لابتوب احترافي', cat:'إلكترونيات', price:3200, cost:2600, qty:14, min:3, barcode:'1001', emoji:'💻'},
    {id:uid(), name:'ماوس لاسلكي', cat:'إكسسوارات', price:95, cost:55, qty:60, min:15, barcode:'1002', emoji:'🖱'},
    {id:uid(), name:'كيبورد ميكانيكي', cat:'إكسسوارات', price:260, cost:160, qty:8, min:10, barcode:'1003', emoji:'⌨️'},
    {id:uid(), name:'شاشة 27 بوصة', cat:'إلكترونيات', price:890, cost:690, qty:20, min:5, barcode:'1004', emoji:'🖥'},
    {id:uid(), name:'سماعة رأس', cat:'إكسسوارات', price:180, cost:110, qty:35, min:10, barcode:'1005', emoji:'🎧'},
    {id:uid(), name:'طابعة ليزر', cat:'معدات مكتبية', price:650, cost:480, qty:6, min:2, barcode:'1006', emoji:'🖨'},
    {id:uid(), name:'هاتف ذكي', cat:'إلكترونيات', price:2400, cost:1900, qty:12, min:4, barcode:'1007', emoji:'📱'},
    {id:uid(), name:'حقيبة لابتوب', cat:'إكسسوارات', price:120, cost:70, qty:40, min:10, barcode:'1008', emoji:'🎒'}
  ];
  const C = [
    ['أحمد الشمري','0501111111','ahmed@mail.com',0],
    ['سارة العلي','0502222222','sara@mail.com',1500],
    ['شركة النور','0112345678','info@alnoor.com',0],
    ['مؤسسة الأفق','0119876543','info@horizon.com',3200]
  ].map(c => ({id:uid(), name:c[0], phone:c[1], email:c[2], address:'', balance:c[3], createdAt:Date.now()}));

  const S = [
    ['مؤسسة التوريد الحديث','0114445566',0],
    ['شركة التقنية المتقدمة','0117778899',2300],
    ['المستودع المركزي','0113332211',0]
  ].map(s => ({id:uid(), name:s[0], phone:s[1], email:'', address:'', balance:s[2], createdAt:Date.now()}));

  const E = [
    ['خالد المدير','مدير عام','0503333333',12000,'2022-01-10'],
    ['منى المحاسبة','محاسبة','0504444444',7500,'2023-03-01'],
    ['عمر المبيعات','مندوب مبيعات','0505555555',5200,'2024-06-15'],
    ['فاطمة الموارد البشرية','مسؤولة توظيف','0506666666',6800,'2023-09-20']
  ].map(e => ({id:uid(), name:e[0], role:e[1], phone:e[2], salary:e[3], hire:e[4], createdAt:Date.now()}));

  const sales = [], purchases = [], txns = [];
  let cs = 1, cp = 1;
  const months = [...Array(6)].map((_,i) => { const d = new Date(); d.setMonth(d.getMonth() - (5-i)); return d; });
  months.forEach((m, mi) => {
    const p1 = P[mi % P.length], p2 = P[(mi+2) % P.length];
    const q1 = 2+mi, q2 = 1+mi, sub = p1.price*q1 + p2.price*q2, tax = sub * 0.15;
    sales.push({id:uid(), number:'INV-'+String(cs++).padStart(4,'0'), date:m.toISOString().slice(0,10),
      partyId:C[mi % C.length].id,
      items:[{productId:p1.id, name:p1.name, qty:q1, price:p1.price}, {productId:p2.id, name:p2.name, qty:q2, price:p2.price}],
      discount:0, taxRate:15, subtotal:sub, total:sub+tax, status:'completed', createdAt:m.getTime()});
    txns.push({id:uid(), date:m.toISOString().slice(0,10), type:'income', amount:sub+tax, desc:'فاتورة مبيعات', createdAt:m.getTime()});
    if(mi % 2 === 0){
      const pp = P[(mi+1) % P.length], psub = pp.cost * 10;
      purchases.push({id:uid(), number:'PUR-'+String(cp++).padStart(4,'0'), date:m.toISOString().slice(0,10),
        partyId:S[mi % S.length].id,
        items:[{productId:pp.id, name:pp.name, qty:10, price:pp.cost}],
        discount:0, taxRate:15, subtotal:psub, total:psub*1.15, status:'completed', createdAt:m.getTime()});
      txns.push({id:uid(), date:m.toISOString().slice(0,10), type:'expense', amount:psub*1.15, desc:'فاتورة شراء', createdAt:m.getTime()});
    }
    txns.push({id:uid(), date:m.toISOString().slice(0,10), type:'expense', amount:31500, desc:'رواتب شهرية', createdAt:m.getTime()});
  });

  const projects = [
    {id:uid(), name:'تطوير الموقع الإلكتروني', client:C[0].id, budget:45000, spent:28000, progress:65, status:'active', start:'2025-01-15', end:'2025-06-30', tasks:12, done:8},
    {id:uid(), name:'حملة تسويقية رقمية', client:C[1].id, budget:20000, spent:12000, progress:40, status:'active', start:'2025-03-01', end:'2025-05-15', tasks:8, done:3},
    {id:uid(), name:'نظام إدارة المخزون', client:C[2].id, budget:60000, spent:55000, progress:90, status:'active', start:'2024-11-01', end:'2025-03-31', tasks:20, done:18}
  ];

  const assets = [
    {id:uid(), name:'سيارة توصيل', cat:'مركبات', cost:85000, purchase:'2023-05-10', life:5, depreciation:'straight'},
    {id:uid(), name:'أثاث المكتب الرئيسي', cat:'أثاث', cost:32000, purchase:'2022-08-20', life:10, depreciation:'straight'},
    {id:uid(), name:'خادم البيانات', cat:'تقنية', cost:45000, purchase:'2024-01-15', life:4, depreciation:'straight'}
  ];

  const workflows = [
    {id:uid(), type:'purchase', title:'طلب شراء شاشات', amount:17800, by:'عمر المبيعات', date:today(), status:'pending', approver:'مدير العمليات'},
    {id:uid(), type:'leave', title:'طلب إجازة سنوية', amount:0, by:'منى المحاسبة', date:today(), status:'pending', approver:'مدير النظام'},
    {id:uid(), type:'expense', title:'مصروف صيانة مكيفات', amount:2500, by:'فاطمة الموارد البشرية', date:today(), status:'approved', approver:'مدير النظام'}
  ];

  const notifications = [
    {id:uid(), text:'تم إضافة فاتورة مبيعات جديدة', time:now(), read:false, type:'sale'},
    {id:uid(), text:'تنبيه: مخزون كيبورد ميكانيكي منخفض', time:now(), read:false, type:'inventory'},
    {id:uid(), text:'طلب شراء بانتظار الموافقة', time:now(), read:false, type:'workflow'}
  ];

  const audit = [];

  DB = {
    settings: {
      companyName:'ERP Pro MAX',
      currency:'ر.س',
      taxRate:15,
      accent:'#6c5ce7',
      theme:'dark',
      radius:'14px',
      fontSize:'15px',
      modules: {
        pos:1, sales:1, purchases:1, inventory:1, customers:1, suppliers:1, hr:1,
        accounting:1, projects:1, assets:1, workflows:1, reports:1
      }
    },
    users, customers: C, suppliers: S, products: P, employees: E,
    sales, purchases, transactions: txns,
    projects, assets, workflows, notifications, audit,
    counters: { sale: cs, purchase: cp }
  };
  saveDB();
}

// إذا لم تكن البيانات موجودة، نقوم بإنشائها
if(!DB) seedDB();

// ===== أدوات =====
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmt = n => (+n||0).toLocaleString('en-US', {maximumFractionDigits:2});
const money = n => fmt(n) + ' ' + DB.settings.currency;
function toast(msg, type='ok'){
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (type==='err'?' err':'');
  clearTimeout(t._x); t._x = setTimeout(() => t.className = '', 2800);
}
function openModal(title, body, onOk, ok='حفظ'){
  $('#mTitle').textContent = title; $('#mBody').innerHTML = body;
  $('#mOk').textContent = ok; $('#mOk').onclick = onOk;
  $('#modal').classList.add('show');
}
function closeModal(){ $('#modal').classList.remove('show'); }
$('#modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });

const fText = (k,l,v='',req=false) => `<div class="fg"><label>${l}${req?' <span style="color:var(--danger)">*</span>':''}</label><input id="f_${k}" value="${esc(v)}"></div>`;
const fNum = (k,l,v=0,req=false) => `<div class="fg"><label>${l}${req?' <span style="color:var(--danger)">*</span>':''}</label><input id="f_${k}" type="number" step="any" min="0" value="${v}"></div>`;
const fDate = (k,l,v) => `<div class="fg"><label>${l}</label><input id="f_${k}" type="date" value="${v||today()}"></div>`;
const fSelect = (k,l,opts,v) => `<div class="fg"><label>${l}</label><select id="f_${k}">${opts.map(o => `<option value="${o[0]}" ${o[0]===v?'selected':''}>${o[1]}</option>`).join('')}</select></div>`;

function addAudit(action, detail=''){
  DB.audit.unshift({id:uid(), user:CURRENT_USER?CURRENT_USER.name:'النظام', action, detail, time:now()});
  if(DB.audit.length > 200) DB.audit = DB.audit.slice(0,200);
  saveDB();
}

// ===== الثيم =====
function applyTheme(){
  const s = DB.settings, r = document.documentElement.style;
  r.setProperty('--accent', s.accent); r.setProperty('--radius', s.radius);
  document.body.classList.toggle('light', s.theme === 'light');
  document.body.style.fontSize = s.fontSize;
  $('#brandName').textContent = s.companyName;
  $('#brandLogo').textContent = (s.companyName || 'E').trim().charAt(0);
  document.title = s.companyName + ' | ERP Pro MAX';
}
function toggleTheme(){ DB.settings.theme = DB.settings.theme === 'dark' ? 'light' : 'dark'; saveDB(); applyTheme(); render(); }

// ===== التنقل =====
const NAV = [
  {id:'dashboard', label:'لوحة التحكم', icon:'📊', section:'الرئيسية', always:1},
  {id:'pos', label:'نقاط البيع', icon:'🛒', section:'العمليات'},
  {id:'sales', label:'المبيعات', icon:'📋', section:'العمليات'},
  {id:'purchases', label:'المشتريات', icon:'📦', section:'العمليات'},
  {id:'inventory', label:'المخزون', icon:'🏬', section:'العمليات'},
  {id:'customers', label:'العملاء', icon:'👥', section:'العلاقات'},
  {id:'suppliers', label:'الموردون', icon:'🤝', section:'العلاقات'},
  {id:'hr', label:'الموظفون', icon:'🧑‍💼', section:'الموارد'},
  {id:'projects', label:'المشاريع', icon:'📁', section:'الموارد'},
  {id:'assets', label:'الأصول الثابتة', icon:'🏗', section:'الموارد'},
  {id:'accounting', label:'المحاسبة', icon:'💰', section:'المالية'},
  {id:'workflows', label:'سير العمل', icon:'✅', section:'المالية'},
  {id:'reports', label:'التقارير', icon:'📈', section:'التحليلات'},
  {id:'audit', label:'سجل النشاط', icon:'📋', section:'النظام'},
  {id:'settings', label:'الإعدادات', icon:'⚙️', section:'النظام', always:1}
];
let PAGE = 'dashboard';
function buildNav(){
  let html = '', lastSection = '';
  NAV.filter(n => n.always || DB.settings.modules[n.id]).forEach(n => {
    if(n.section !== lastSection){ html += `<div class="nav-section">${n.section}</div>`; lastSection = n.section; }
    const badge = n.id === 'workflows' ? DB.workflows.filter(w => w.status === 'pending').length : 0;
    html += `<div class="nav-item ${PAGE===n.id?'active':''}" onclick="go('${n.id}')">
      <span class="ico">${n.icon}</span>${n.label}${badge ? `<span class="badge">${badge}</span>` : ''}</div>`;
  });
  $('#nav').innerHTML = html;
}
function go(p){ PAGE = p; render(); toggleNav(false); window.scrollTo({top:0}); }
function toggleNav(force){ document.body.classList.toggle('nav-open', force !== undefined ? force : !document.body.classList.contains('nav-open')); }
function render(){ buildNav(); const n = NAV.find(x => x.id === PAGE); $('#pageTitle').textContent = n ? n.label : ''; $('#content').innerHTML = PAGES[PAGE] ? PAGES[PAGE]() : '<div class="empty">غير موجود</div>'; afterRender(); updateNotif(); }

// ===== الإشعارات =====
function updateNotif(){
  const unread = DB.notifications.filter(n => !n.read).length;
  const low = DB.products.filter(p => p.qty <= p.min).length;
  const total = unread + low;
  const b = $('#notifBadge'); b.style.display = total ? 'grid' : 'none'; b.textContent = total;
  let html = `<h4>🔔 الإشعارات <button class="btn xs ghost" onclick="markAllRead()">تحديد الكل كمقروء</button></h4>`;
  DB.notifications.slice(0,10).forEach(n => {
    html += `<div class="notif-item ${n.read?'':'unread'}"><div><div>${n.text}</div><div class="time">${new Date(n.time).toLocaleString('ar')}</div></div></div>`;
  });
  if(low) html += `<div class="notif-item unread"><div>⚠️ <b>${low}</b> أصناف منخفضة المخزون</div></div>`;
  $('#notifPanel').innerHTML = html;
}
function markAllRead(){ DB.notifications.forEach(n => n.read = true); saveDB(); updateNotif(); }
function toggleNotif(e){ e.stopPropagation(); $('#notifPanel').classList.toggle('show'); $('#userMenu').classList.remove('show'); }
function toggleUserMenu(e){ e.stopPropagation(); $('#userMenu').classList.toggle('show'); $('#notifPanel').classList.remove('show'); }
document.addEventListener('click', e => { if(!e.target.closest('.rel')) { $('#notifPanel').classList.remove('show'); $('#userMenu').classList.remove('show'); } });
function notify(text, type='info'){ DB.notifications.unshift({id:uid(), text, time:now(), read:false, type}); saveDB(); updateNotif(); }

// ===== الوحدات العامة =====
const ENT = {
  customers: { key:'customers', title:'العملاء', single:'عميل', icon:'👥', fields: [['name','اسم العميل',1],['phone','الهاتف'],['email','البريد'],['address','العنوان'],['balance','الرصيد الافتتاحي','money']] },
  suppliers: { key:'suppliers', title:'الموردون', single:'مورد', icon:'🤝', fields: [['name','اسم المورد',1],['phone','الهاتف'],['email','البريد'],['address','العنوان'],['balance','الرصيد الافتتاحي','money']] },
  products: { key:'products', title:'المخزون والأصناف', single:'صنف', icon:'🏬', fields: [['name','اسم الصنف',1],['cat','التصنيف'],['emoji','الرمز'],['barcode','الباركود'],['price','سعر البيع','money'],['cost','التكلفة','money'],['qty','الكمية','num'],['min','حد الطلب','num']] },
  employees: { key:'employees', title:'الموظفون', single:'موظف', icon:'🧑‍💼', fields: [['name','اسم الموظف',1],['role','الوظيفة'],['phone','الهاتف'],['salary','الراتب','money'],['hire','تاريخ التعيين','date']] }
};
function entityForm(k, item={}){
  const c = ENT[k];
  return '<div class="frm c2">' + c.fields.map(f => {
    const [kk, l, t] = f; const v = item[kk] ?? '';
    if(t === 'money' || t === 'num') return fNum(kk,l,v);
    if(t === 'date') return fDate(kk,l,v);
    return fText(kk,l,v, kk === 'name');
  }).join('') + '</div>';
}
function saveEntity(k, id){
  const c = ENT[k];
  const obj = id ? DB[k].find(x => x.id === id) : { id: uid(), createdAt: Date.now() };
  for(const f of c.fields){
    const v = $('#f_'+f[0]).value;
    if(f[0] === 'name' && !v.trim()) return toast('الاسم مطلوب','err');

let POS_CART = [];
function posPage(){
  const cats = [...new Set(DB.products.map(p => p.cat))];
  return `<div class="page-head"><h1>🛒 نقاط البيع</h1><span class="sp"></span>
    <div class="search-box"><input id="posSearch" placeholder="بحث أو باركود..." oninput="filterPOS(this.value)"></div></div>
  <div class="pos-layout">

      </div>
      <div class="pos-grid" id="posGrid">${DB.products.map(p => `
        <div class="pos-item" data-cat="${p.cat}" data-name="${p.name}" onclick="addToPOS('${p.id}')">
          <div class="emoji">${p.emoji||'📦'}</div>
          <div class="name">${esc(p.name)}</div>
          <div class="price">${money(p.price)}</div>
          <div class="qty">متوفر: ${fmt(p.qty)}</div>
        </div>`).join('')}
      </div>
    </div>
    <div class="pos-cart">
      <div class="pos-cart-head"><span>🧾 السلة</span><button class="btn xs danger" onclick="clearPOS()">مسح</button></div>
      <div class="pos-cart-items" id="posCartItems"></div>
      <div class="pos-cart-foot">
        <div class="pos-barcode"><input id="posBarcode" placeholder="امسح الباركود..." onkeydown="if(event.key==='Enter')scanPOS(this.value)"><button class="btn sm" onclick="scanPOS($('#posBarcode').value)">📷</button></div>
        <div class="pos-total"><span>الإجمالي:</span><span id="posTotal">0 ${DB.settings.currency}</span></div>
        <button class="btn success" style="width:100%;justify-content:center" onclick="checkoutPOS()">✅ إتمام البيع</button>
      </div>
    </div>
  </div>`;
}
function addToPOS(pid){
  const p = DB.products.find(x => x.id === pid); if(!p) return;
  const ex = POS_CART.find(x => x.productId === pid);
  if(ex){ ex.qty++; } else { POS_CART.push({ productId: pid, name: p.name, price: p.price, qty: 1 }); }
  renderPOSCart();
}
function renderPOSCart(){
  const el = $('#posCartItems'); if(!el) return;
  el.innerHTML = POS_CART.map((item,i) => `<div class="pos-cart-item">
    <span>${esc(item.name)}</span>
    <div class="qty-ctrl"><button onclick="posQty(${i},-1)">−</button><span>${item.qty}</span><button onclick="posQty(${i},1)">+</button></div>
    <span class="total">${money(item.price*item.qty)}</span>
    <span class="del-item" onclick="posRemove(${i})">✕</span></div>`).join('') || '<div class="empty" style="padding:20px">السلة فارغة</div>';
  const total = POS_CART.reduce((a,i) => a + i.price*i.qty, 0);
  $('#posTotal').textContent = money(total);
}
function posQty(i,d){ POS_CART[i].qty = Math.max(1, POS_CART[i].qty + d); renderPOSCart(); }
function posRemove(i){ POS_CART.splice(i,1); renderPOSCart(); }
function clearPOS(){ POS_CART = []; renderPOSCart(); }
function filterPOS(q){ $$('.pos-item').forEach(el => { el.style.display = el.dataset.name.includes(q) ? '' : 'none'; }); }
function filterPOSCat(cat){ $$('.pos-item').forEach(el => { el.style.display = (cat === 'all' || el.dataset.cat === cat) ? '' : 'none'; }); }
function scanPOS(code){
  const p = DB.products.find(x => x.barcode === code.trim());
  if(p){ addToPOS(p.id); $('#posBarcode').value = ''; toast('تم إضافة: '+p.name); } else toast('باركود غير موجود','err');
}
function checkoutPOS(){
  if(!POS_CART.length) return toast('السلة فارغة','err');
  const sub = POS_CART.reduce((a,i) => a + i.price*i.qty, 0);
  const tax = sub * DB.settings.taxRate / 100;
  const total = sub + tax;
  const num = 'POS-'+String(DB.counters.sale).padStart(4,'0'); DB.counters.sale++;
  POS_CART.forEach(item => { const p = DB.products.find(x => x.id === item.productId); if(p) p.qty -= item.qty; });
  DB.sales.push({id:uid(), number:num, date:today(), partyId:null,
    items: POS_CART.map(i => ({productId:i.productId, name:i.name, qty:i.qty, price:i.price})),
    discount:0, taxRate:DB.settings.taxRate, subtotal:sub, total, status:'completed', createdAt:Date.now()});
  DB.transactions.push({id:uid(), date:today(), type:'income', amount:total, desc:'بيع POS '+num, createdAt:Date.now()});
  POS_CART = []; saveDB(); render(); notify('تم بيع '+num+' بمبلغ '+money(total),'sale');
  addAudit('بيع POS', num+' - '+money(total)); toast('تم إتمام البيع ✓ '+money(total));
}

window.addInvRow = () => {
  if(!DB.products.length) return toast('أضف أصنافاً أولاً','err');
  const opts = DB.products.map(p => `<option value="${p.id}">${esc(p.name)} (${fmt(p.qty)})</option>`).join('');
  const d = document.createElement('div'); d.className = 'inv-row';
  d.innerHTML = `<select class="ip" onchange="rowProd(this)"><option value="">اختر صنفاً</option>${opts}</select>
  <input type="number" class="iq" min="1" value="1" oninput="calcInv()"><input type="number" class="ipr" min="0" step="0.01" placeholder="السعر" oninput="calcInv()">
  <button class="ibtn" onclick="this.parentElement.remove();calcInv()">✕</button>`;
  $('#inv_items').appendChild(d); calcInv();
};
window.rowProd = sel => { const p = DB.products.find(x => x.id === sel.value); if(p) sel.closest('.inv-row').querySelector('.ipr').value = p.price; calcInv(); };
window.calcInv = () => {
  let sub = 0; $$('.inv-row').forEach(r => { sub += (+r.querySelector('.iq').value||0) * (+r.querySelector('.ipr').value||0); });
  const disc = +($('#inv_disc')?.value||0), tax = +($('#inv_tax')?.value||0), after = Math.max(sub - disc, 0), tv = after * tax / 100;
  if($('#inv_sub')){ $('#inv_sub').textContent = money(sub); $('#inv_discv').textContent = money(disc); $('#inv_taxv').textContent = money(tv); $('#inv_total').textContent = money(after+tv); }
};
function saveInvoice(type){
  const c = invCfg(type);
  const partyId = $('#inv_party').value;
  const rows = $$('.inv-row').map(r => ({ productId: r.querySelector('.ip').value, name: DB.products.find(p => p.id === r.querySelector('.ip').value)?.name || '', qty: +r.querySelector('.iq').value||0, price: +r.querySelector('.ipr').value||0 })).filter(r => r.productId && r.qty > 0);
  if(!rows.length) return toast('أضف صنفاً واحداً','err');
  const sub = rows.reduce((a,r) => a + r.qty*r.price, 0), disc = +$('#inv_disc').value||0, tax = +$('#inv_tax').value||0;
  const after = Math.max(sub - disc, 0), total = after + after*tax/100;
  const num = c.pre+'-'+String(DB.counters[type === 'sale' ? 'sale' : 'purchase']).padStart(4,'0');
  DB.counters[type === 'sale' ? 'sale' : 'purchase']++;
  rows.forEach(r => { const p = DB.products.find(x => x.id === r.productId); if(p){ p.qty += c.sign * r.qty; if(type === 'purchase') p.cost = r.price; } });
  DB[c.db].push({id:uid(), number:num, date:$('#inv_date').value||today(), partyId, items:rows, discount:disc, taxRate:tax, subtotal:sub, total, status:'completed', createdAt:Date.now()});
  DB.transactions.push({id:uid(), date:today(), type: type === 'sale' ? 'income' : 'expense', amount:total, desc: (type === 'sale' ? 'مبيعات ' : 'شراء ')+num, createdAt:Date.now()});
  saveDB(); closeModal(); render(); notify('فاتورة '+num+' - '+money(total), type);
  addAudit(type === 'sale' ? 'فاتورة بيع' : 'فاتورة شراء', num); toast('تم حفظ '+num+' ✓');
}
window.viewInv = (type, id) => {
  const c = invCfg(type); const inv = DB[c.db].find(x => x.id === id); if(!inv) return;
  const p = DB[c.party].find(x => x.id === inv.partyId);
  openModal('فاتورة '+inv.number, `<div style="font-size:.85rem;margin-bottom:12px"><b>${esc(DB.settings.companyName)}</b> | التاريخ: ${inv.date} | ${c.partyL}: ${esc(p ? p.name : 'نقدي')}</div>

function getTopProducts(){
  const map = {};
  DB.sales.forEach(s => s.items.forEach(i => { if(!map[i.name]) map[i.name] = { name:i.name, qty:0, rev:0 }; map[i.name].qty += i.qty; map[i.name].rev += i.qty * i.price; }));
  return Object.values(map).sort((a,b) => b.rev - a.rev).slice(0,8);
}
function exportCSV(){
  let csv = 'النوع,التاريخ,البيان,المبلغ\n';
  DB.transactions.forEach(t => { csv += `${t.type === 'income' ? 'إيراد' : 'مصروف'},${t.date},"${t.desc}",${t.amount}\n`; });
  const b = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'report-'+today()+'.csv'; a.click();
  toast('تم التصدير ✓');

// ===== المخططات =====
function chartBase(id){
  const cv = document.getElementById(id); if(!cv) return null;
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight || 260;
  cv.width = w*dpr; cv.height = h*dpr;
  const x = cv.getContext('2d'); x.scale(dpr,dpr); x.clearRect(0,0,w,h);
  return { x, w, h };
}
function barChart(id, labels, series){
  const c = chartBase(id); if(!c) return;
  const { x, w, h } = c;
  const pad = 34, bw = w - pad*2, bh = h - pad*1.6;
  const max = Math.max(...series.flatMap(s => s.data), 1) * 1.15;
  const muted = getComputedStyle(document.body).getPropertyValue('--muted');
  x.strokeStyle = getComputedStyle(document.body).getPropertyValue('--border');
  x.fillStyle = muted; x.font = '11px Cairo'; x.textAlign = 'center';
  for(let i = 0; i <= 4; i++){
    const y = pad*.6 + bh - (bh/4)*i;
    x.beginPath(); x.moveTo(pad, y); x.lineTo(w - pad/2, y);
    x.globalAlpha = .4; x.stroke(); x.globalAlpha = 1;
    x.textAlign = 'right'; x.fillText(fmt(max/4 * i), pad - 6, y + 4);
  }
  const n = labels.length, gw = bw/n, bwPer = gw * .7 / series.length;
  labels.forEach((lb, i) => {
    x.fillStyle = muted; x.textAlign = 'center'; x.fillText(lb, pad + gw*i + gw/2, h - 6);
    series.forEach((s, si) => {
      const v = s.data[i] || 0, vh = v/max * bh;
      const bx = pad + gw*i + (gw - gw*.7)/2 + bwPer*si;
      const g = x.createLinearGradient(0, pad+bh-vh, 0, pad+bh);
      g.addColorStop(0, s.color); g.addColorStop(1, s.color+'44');
      x.fillStyle = g;
      x.beginPath();
      x.roundRect(bx, pad*.6 + bh - vh, Math.max(bwPer - 3, 4), vh, [5,5,0,0]);
      x.fill();
    });
  });
}
const AR_M = ['ينا','فبر','مار','أبر','ماي','يون','يول','أغس','سبت','أكت','نوف','ديس'];
function lastMonths(n){
  const out = [];
  const d = new Date(); d.setDate(1);
  for(let i = n-1; i >= 0; i--){
    const m = new Date(d.getFullYear(), d.getMonth() - i, 1);
    out.push({ key: m.toISOString().slice(0,7), label: AR_M[m.getMonth()] });
  }
  return out;
}
function monthlySeries(dbKey){
  return lastMonths(6).map(m => DB[dbKey].filter(r => (r.date||'').startsWith(m.key)).reduce((a,r) => a + r.total, 0));
}
function afterRender(){
  const A = DB.settings.accent;
  const labels = lastMonths(6).map(m => m.label);
  if(PAGE === 'dashboard' || PAGE === 'reports'){

  }
  if(PAGE === 'reports'){
    barChart('ch2', labels, [
      { color: '#00b894', data: lastMonths(6).map(m => DB.transactions.filter(t => t.type === 'income' && (t.date||'').startsWith(m.key)).reduce((a,t) => a + t.amount, 0)) },

}
