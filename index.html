            const data = {
                id: generateId(),
                type,
                amount,
                category: $('tCategory').value,
                description: $('tDesc').value.trim(),
                date: $('tDate').value || new Date().toISOString(),
                user: currentUser?.user_metadata?.full_name || 'المدير'
            };

            const trans = JSON.parse(localStorage.getItem('erp_transactions') || '[]');
            trans.push(data);
            localStorage.setItem('erp_transactions', JSON.stringify(trans));
            logActivity((type === 'income' ? 'إيراد' : 'مصروف') + ': ' + fmt(amount));
            closeModal();
            renderAccounting();
            toast('✅ تم الحفظ', 'success');
        }

        function openJournalEntry() {
            let body = `
                <div class="form-group"><label>التاريخ</label><input type="date" class="form-control" id="jDate" value="${new Date().toISOString().slice(0,10)}"></div>
                <div class="form-group"><label>الوصف *</label><input class="form-control" id="jDesc"></div>
                <div class="form-row"><div class="form-group"><label>المدين</label><input type="number" class="form-control" id="jDebit" step="0.01"></div>
                    <div class="form-group"><label>الدائن</label><input type="number" class="form-control" id="jCredit" step="0.01"></div></div>
                <div class="form-group"><label>الحساب</label><input class="form-control" id="jAccount" placeholder="اسم الحساب"></div>
            `;
            openModal('قيد محاسبي جديد', body,
                `<button class="btn btn-primary" onclick="saveJournalEntry()">💾 حفظ</button><button class="btn btn-outline" onclick="closeModal()">إلغاء</button>`
            );
        }

        function saveJournalEntry() {
            const desc = $('jDesc').value.trim();
            const debit = Number($('jDebit').value) || 0;
            const credit = Number($('jCredit').value) || 0;
            const account = $('jAccount').value.trim();

            if (!desc || (debit === 0 && credit === 0) || !account) return toast('جميع الحقول مطلوبة', 'warning');

            const date = $('jDate').value || new Date().toISOString();

            // Save as transaction
            const trans = JSON.parse(localStorage.getItem('erp_transactions') || '[]');
            if (debit > 0) {
                trans.push({
                    id: generateId(),
                    type: 'expense',
                    amount: debit,
                    category: account,
                    description: desc + ' (مدين)',
                    date,
                    user: currentUser?.user_metadata?.full_name || 'المدير'
                });
            }
            if (credit > 0) {
                trans.push({
                    id: generateId(),
                    type: 'income',
                    amount: credit,
                    category: account,
                    description: desc + ' (دائن)',
                    date,
                    user: currentUser?.user_metadata?.full_name || 'المدير'
                });
            }
            localStorage.setItem('erp_transactions', JSON.stringify(trans));

            // Save journal entry
            const journal = JSON.parse(localStorage.getItem('erp_journal') || '[]');
            journal.push({
                id: generateId(),
                date,
                description: desc,
                account,
                debit,
                credit,
                createdAt: new Date().toISOString()
            });
            localStorage.setItem('erp_journal', JSON.stringify(journal));

            logActivity('قيد محاسبي: ' + desc);
            closeModal();
            renderAccounting();
            toast('✅ تم حفظ القيد المحاسبي', 'success');
        }

        function deleteTrans(id) {
            if (!confirm('حذف المعاملة؟')) return;
            let trans = JSON.parse(localStorage.getItem('erp_transactions') || '[]');
            trans = trans.filter(x => x.id !== id);
            localStorage.setItem('erp_transactions', JSON.stringify(trans));
            renderAccounting();
            toast('🗑️ تم الحذف', 'info');
        }

        // =============================================
        // 24. WORKFLOWS
        // =============================================
        function renderWorkflows() {
            const workflows = JSON.parse(localStorage.getItem('erp_workflows') || '[]');
            let html = `<div class="toolbar"><button class="btn btn-primary" onclick="openWorkflowModal()">➕ طلب جديد</button></div>`;
            if (workflows.length === 0) {
                html +=
                    `<div class="card"><div class="card-body"><div class="empty-state"><div class="icon">⚙️</div><h3>لا توجد طلبات</h3></div></div></div>`;
            } else {
                const statusColors = { pending: 'warning', approved: 'success', rejected: 'danger' };
                const statusLabels = { pending: 'قيد المراجعة', approved: 'موافق عليه', rejected: 'مرفوض' };
                workflows.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(w => {
                    const steps = w.steps || [];
                    const currentStep = steps.findIndex(s => s.status === 'pending');
                    html += `
                        <div class="card"><div class="card-body">
                            <div class="flex-between mb-10">
                                <div><span style="font-weight:700;">${w.title}</span> <span class="badge badge-${statusColors[w.status]||'info'}">${statusLabels[w.status]||w.status}</span></div>
                                <div class="btn-group">
                                    ${w.status==='pending' ? `
                                        <button class="btn btn-sm btn-success" onclick="approveWorkflow('${w.id}')">✅</button>
                                        <button class="btn btn-sm btn-danger" onclick="rejectWorkflow('${w.id}')">❌</button>
                                    ` : ''}
                                    <button class="btn btn-sm btn-danger" onclick="deleteWorkflow('${w.id}')">🗑️</button>
                                </div>
                            </div>
                            <div style="font-size:0.85em;color:var(--text2);">${w.description||''}<br>بواسطة: ${w.requestedBy} - ${fmtDate(w.date)}</div>
                            <div style="display:flex;gap:5px;margin-top:10px;">
                                ${steps.map((s,i) => {
                                    let cls = '';
                                    if(s.status==='approved') cls='done';
                                    else if(s.status==='rejected') cls='';
                                    else if(i===currentStep) cls='current';
                                    return `<div style="flex:1;height:6px;border-radius:3px;background:${cls==='done'?'var(--secondary)':cls==='current'?'var(--warning)':'var(--border)'};" title="${s.label||''}"></div>`;
                                }).join('')}
                            </div>
                        </div></div>
                    `;
                });
            }
            $('pageContent').innerHTML = html;
        }

        function openWorkflowModal() {
            let body = `
                <div class="form-group"><label>عنوان الطلب *</label><input class="form-control" id="wfTitle"></div>
                <div class="form-group"><label>الوصف</label><textarea class="form-control" id="wfDesc"></textarea></div>
                <div class="form-group"><label>النوع</label><select class="form-control" id="wfType">
                    ${['طلب شراء','طلب إجازة','طلب سفر','طلب ميزانية','أخرى'].map(t => `<option>${t}</option>`).join('')}</select></div>
                <div class="form-group"><label>عدد مراحل الموافقة</label><input type="number" class="form-control" id="wfSteps" value="2" min="1" max="5"></div>
            `;
            openModal('طلب موافقة جديد', body,
                `<button class="btn btn-primary" onclick="saveWorkflow()">💾 إرسال</button><button class="btn btn-outline" onclick="closeModal()">إلغاء</button>`
            );
        }

        function saveWorkflow() {
            const title = $('wfTitle').value.trim();
            if (!title) return toast('عنوان الطلب مطلوب', 'warning');

            const numSteps = Number($('wfSteps').value) || 2;
            const steps = [];
            for (let i = 0; i < numSteps; i++) {
                steps.push({ label: 'مرحلة ' + (i + 1), status: i === 0 ? 'pending' : 'waiting' });
            }

            const wf = {
                id: generateId(),
                title,
                description: $('wfDesc').value.trim(),
                type: $('wfType').value,
                status: 'pending',
                steps,
                requestedBy: currentUser?.user_metadata?.full_name || 'المدير',
                date: new Date().toISOString()
            };

            const items = JSON.parse(localStorage.getItem('erp_workflows') || '[]');
            items.push(wf);
            localStorage.setItem('erp_workflows', JSON.stringify(items));
            logActivity('طلب موافقة: ' + title);
            closeModal();
            renderWorkflows();
            toast('✅ تم إرسال الطلب', 'success');
        }

        function approveWorkflow(id) {
            const items = JSON.parse(localStorage.getItem('erp_workflows') || '[]');
            const w = items.find(x => x.id === id);
            if (!w) return;

            const currentStep = (w.steps || []).find(s => s.status === 'pending');
            if (currentStep) {
                currentStep.status = 'approved';
                currentStep.approvedBy = currentUser?.user_metadata?.full_name || 'المدير';
                currentStep.approvedAt = new Date().toISOString();
                const nextStep = w.steps.find(s => s.status === 'waiting');
                if (nextStep) nextStep.status = 'pending';
                else w.status = 'approved';
            }
            localStorage.setItem('erp_workflows', JSON.stringify(items));
            logActivity('موافقة على: ' + w.title);
            renderWorkflows();
            toast('✅ تمت الموافقة', 'success');
        }

        function rejectWorkflow(id) {
            if (!confirm('رفض هذا الطلب؟')) return;
            const items = JSON.parse(localStorage.getItem('erp_workflows') || '[]');
            const w = items.find(x => x.id === id);
            if (!w) return;
            w.status = 'rejected';
            const currentStep = (w.steps || []).find(s => s.status === 'pending');
            if (currentStep) {
                currentStep.status = 'rejected';
                currentStep.rejectedBy = currentUser?.user_metadata?.full_name || 'المدير';
            }
            localStorage.setItem('erp_workflows', JSON.stringify(items));
            logActivity('رفض طلب: ' + w.title);
            renderWorkflows();
            toast('❌ تم الرفض', 'info');
        }

        function deleteWorkflow(id) {
            if (!confirm('حذف الطلب؟')) return;
            let items = JSON.parse(localStorage.getItem('erp_workflows') || '[]');
            items = items.filter(x => x.id !== id);
            localStorage.setItem('erp_workflows', JSON.stringify(items));
            renderWorkflows();
            toast('🗑️ تم الحذف', 'info');
        }

        function generateReport(type) {
            let data = [],
                headers = [],
                title = '';

            if (type === 'sales') {
                title = 'تقرير المبيعات';
                headers = ['الفاتورة', 'التاريخ', 'الإجمالي'];
                JSON.parse(localStorage.getItem('erp_sales') || '[]').forEach(s => data.push([s.invoiceNo, s.date, s
                .total]));
            } else if (type === 'inventory') {
                title = 'تقرير المخزون';
                headers = ['المنتج', 'الفئة', 'المخزون', 'السعر'];
                JSON.parse(localStorage.getItem('erp_products') || '[]').forEach(p => data.push([p.name, p.category, p
                    .stock, p.price
                ]));
            } else if (type === 'financial') {
                title = 'التقرير المالي';
                headers = ['التاريخ', 'النوع', 'المبلغ'];
                JSON.parse(localStorage.getItem('erp_transactions') || '[]').forEach(t => data.push([t.date, t.type, t
                    .amount
                ]));
            } else if (type === 'employees') {
                title = 'تقرير الموظفين';
                headers = ['الاسم', 'المنصب', 'الراتب', 'الحالة'];
                JSON.parse(localStorage.getItem('erp_employees') || '[]').forEach(e => data.push([e.name, e.position, e
                    .salary, e.active !== false ? 'نشط' : 'غير نشط'
                ]));
            } else if (type === 'attendance') {
                title = 'تقرير الحضور';
                headers = ['الموظف', 'التاريخ', 'الحالة'];
                const employees = JSON.parse(localStorage.getItem('erp_employees') || '[]');
                JSON.parse(localStorage.getItem('erp_attendance') || '[]').forEach(a => {
                    const emp = employees.find(e => e.id === a.employeeId);
                    data.push([emp ? emp.name : 'غير محدد', a.date, a.status]);
                });
            } else if (type === 'leaves') {
                title = 'تقرير الإجازات';
                headers = ['الموظف', 'النوع', 'من', 'إلى', 'الأيام', 'الحالة'];
                const employees = JSON.parse(localStorage.getItem('erp_employees') || '[]');
                JSON.parse(localStorage.getItem('erp_leaves') || '[]').forEach(l => {
                    const emp = employees.find(e => e.id === l.employeeId);
                    data.push([emp ? emp.name : 'غير محدد', l.type, l.startDate, l.endDate, l.days, l.status]);
                });
            }

            let html =
                `<div class="card"><div class="card-header"><h3>${title}</h3><button class="btn btn-sm btn-success" onclick="exportReport('${type}')">📥 تصدير CSV</button></div><div class="card-body no-pad"><div class="table-responsive"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`;
            if (data.length === 0) {
                html +=
                    `<tr><td colspan="${headers.length}" class="text-center" style="padding:30px;">لا توجد بيانات</td></tr>`;
            } else {
                data.forEach(row => html += `<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`);
            }
            html += `</tbody></table></div></div></div>`;
            $('reportOutput').innerHTML = html;
        }

        function exportReport(type) {
            let data = [],
                headers = [];

            if (type === 'sales') {
                headers = ['الفاتورة', 'التاريخ', 'الإجمالي'];
                JSON.parse(localStorage.getItem('erp_sales') || '[]').forEach(s => data.push([s.invoiceNo, s.date, s
                .total]));
            } else if (type === 'inventory') {
                headers = ['المنتج', 'الفئة', 'المخزون', 'السعر'];
                JSON.parse(localStorage.getItem('erp_products') || '[]').forEach(p => data.push([p.name, p.category, p
                    .stock, p.price
                ]));
            } else if (type === 'financial') {
                headers = ['التاريخ', 'النوع', 'المبلغ'];
                JSON.parse(localStorage.getItem('erp_transactions') || '[]').forEach(t => data.push([t.date, t.type, t
                    .amount
                ]));
            } else if (type === 'employees') {
                headers = ['الاسم', 'المنصب', 'الراتب'];
                JSON.parse(localStorage.getItem('erp_employees') || '[]').forEach(e => data.push([e.name, e.position, e
                    .salary
                ]));
            } else if (type === 'attendance') {
                headers = ['الموظف', 'التاريخ', 'الحالة'];
                const employees = JSON.parse(localStorage.getItem('erp_employees') || '[]');
                JSON.parse(localStorage.getItem('erp_attendance') || '[]').forEach(a => {
                    const emp = employees.find(e => e.id === a.employeeId);
                    data.push([emp ? emp.name : 'غير محدد', a.date, a.status]);
                });
            } else if (type === 'leaves') {
                headers = ['الموظف', 'النوع', 'الأيام', 'الحالة'];
                const employees = JSON.parse(localStorage.getItem('erp_employees') || '[]');
                JSON.parse(localStorage.getItem('erp_leaves') || '[]').forEach(l => {
                    const emp = employees.find(e => e.id === l.employeeId);
                    data.push([emp ? emp.name : 'غير محدد', l.type, l.days, l.status]);
                });
            }

            let csv = '\uFEFF' + headers.join(',') + '\n';
            data.forEach(row => { csv += row.join(',') + '\n'; });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${type}_report.csv`;
            a.click();
            URL.revokeObjectURL(url);
            logActivity('تصدير تقرير: ' + type);
            toast('📥 تم تصدير التقرير', 'success');
        }

                    <div class="form-group"><label>العملة</label><input class="form-control" id="sCurr" value="${currency}"></div>
                    <div class="form-group"><label>نسبة الضريبة %</label><input type="number" class="form-control" id="sTax" value="${taxRate}"></div>
                    <button class="btn btn-primary" onclick="saveSettings()">💾 حفظ الإعدادات</button>
                    <hr style="margin:20px 0;border-color:var(--border);">
                    <button class="btn btn-danger" onclick="resetSystem()">⚠️ إعادة تعيين النظام</button>
                </div></div>
            `;
        }

        function saveSettings() {
            localStorage.setItem('erp_company', $('sComp').value);
            localStorage.setItem('erp_currency', $('sCurr').value);
            localStorage.setItem('erp_tax_rate', $('sTax').value);
            $('sidebarCompany').textContent = $('sComp').value;
            toast('✅ تم حفظ الإعدادات', 'success');
        }

        function resetSystem() {
            if (!confirm('⚠️ تحذير: سيتم حذف جميع البيانات نهائياً!')) return;
            const keys = [];
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k.startsWith('erp_')) keys.push(k);
            }
            keys.forEach(k => localStorage.removeItem(k));
            toast('✅ تم إعادة تعيين النظام', 'success');
            setTimeout(() => location.reload(), 1500);
        }

        // =============================================
        // 28. USERS & BRANCHES
        // =============================================
        function renderUsers() {
            if (!hasPermission('users')) {
                $('pageContent').innerHTML =
                    `<div class="card"><div class="card-body"><div class="empty-state"><div class="icon">🔒</div><h3>ليس لديك صلاحية</h3></div></div></div>`;
                return;
            }
            const users = JSON.parse(localStorage.getItem('erp_users') || '[]');
            let html = `
                <div class="toolbar"><button class="btn btn-primary" onclick="openUserModal()">➕ إضافة مستخدم</button></div>
                <div class="card"><div class="card-body no-pad"><div class="table-responsive">
                    <table><thead><tr><th>#</th><th>الاسم</th><th>البريد</th><th>الدور</th><th>الشركة</th><th>إجراءات</th></tr></thead><tbody>
            `;
            if (users.length === 0) {
                html +=
                    `<tr><td colspan="6" class="text-center" style="padding:40px;"><div class="empty-state"><div class="icon">👤</div><h3>لا يوجد مستخدمين</h3></div></td></tr>`;
            } else {
                users.forEach((u, i) => {
                    html += `<tr>
                        <td>${i+1}</td>
                        <td><strong>${u.name}</strong></td>
                        <td>${u.email}</td>
                        <td><span class="badge badge-${u.role==='admin'?'primary':u.role==='manager'?'warning':u.role==='hr'?'info':'secondary'}">${u.role}</span></td>
                        <td>${u.company||'-'}</td>
                        <td><button class="btn btn-sm btn-danger" onclick="deleteUser('${u.id}')">🗑️</button></td>
                    </tr>`;
                });
            }
            html += `</tbody></table></div></div></div>`;
            $('pageContent').innerHTML = html;
        }

        function openUserModal() {
            let body = `
                <div class="form-group"><label>الاسم الكامل *</label><input class="form-control" id="uName"></div>
                <div class="form-group"><label>البريد الإلكتروني *</label><input type="email" class="form-control" id="uEmail"></div>
                <div class="form-group"><label>كلمة المرور *</label><input type="password" class="form-control" id="uPass"></div>
                <div class="form-group"><label>الدور</label><select class="form-control" id="uRole">
                    <option value="admin">مدير النظام</option>
                    <option value="manager">مدير</option>
                    <option value="hr">موارد بشرية</option>
                    <option value="accountant">محاسب</option>
                    <option value="cashier">كاشير</option>
                    <option value="viewer">مشاهد</option>
                </select></div>
                <div class="form-group"><label>الشركة</label><input class="form-control" id="uComp" placeholder="اسم الشركة"></div>
            `;
            openModal('إضافة مستخدم جديد', body,
                `<button class="btn btn-primary" onclick="saveUser()">💾 حفظ</button><button class="btn btn-outline" onclick="closeModal()">إلغاء</button>`
            );
        }

        function saveUser() {
            const name = $('uName').value.trim();
            const email = $('uEmail').value.trim();
            const pass = $('uPass').value;
            const role = $('uRole').value;
            const company = $('uComp').value.trim();

            if (!name || !email || !pass) return toast('جميع الحقول مطلوبة', 'warning');

            const users = JSON.parse(localStorage.getItem('erp_users') || '[]');
            if (users.find(u => u.email === email)) return toast('هذا البريد مسجل بالفعل', 'error');

            users.push({
                id: generateId(),
                name,
                email,
                password: pass,
                role,
                company: company || 'شركتي',
                createdAt: new Date().toISOString()
            });
            localStorage.setItem('erp_users', JSON.stringify(users));
            logActivity('إضافة مستخدم: ' + name);
            closeModal();
            renderUsers();
            toast('✅ تم إضافة المستخدم', 'success');
        }

        function deleteUser(id) {
            if (!confirm('حذف المستخدم؟')) return;
            if (id === currentUser?.id) return toast('لا يمكن حذف نفسك', 'warning');
            let users = JSON.parse(localStorage.getItem('erp_users') || '[]');
            const u = users.find(x => x.id === id);
            users = users.filter(x => x.id !== id);
            localStorage.setItem('erp_users', JSON.stringify(users));
            logActivity('حذف مستخدم: ' + (u ? u.name : id));
            renderUsers();
            toast('🗑️ تم الحذف', 'info');
        }

        function renderBranches() {
            if (!hasPermission('branches')) {
                $('pageContent').innerHTML =
                    `<div class="card"><div class="card-body"><div class="empty-state"><div class="icon">🔒</div><h3>ليس لديك صلاحية</h3></div></div></div>`;
                return;
            }
            const branches = JSON.parse(localStorage.getItem('erp_branches') || '[]');
            let html = `
                <div class="toolbar"><button class="btn btn-primary" onclick="openBranchModal()">➕ إضافة فرع</button></div>
                <div class="card"><div class="card-body no-pad"><div class="table-responsive">
                    <table><thead><tr><th>#</th><th>الفرع</th><th>الموقع</th><th>الهاتف</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>
            `;
            if (branches.length === 0) {
                html +=
                    `<tr><td colspan="6" class="text-center" style="padding:40px;"><div class="empty-state"><div class="icon">🏬</div><h3>لا توجد فروع</h3></div></td></tr>`;
            } else {
                branches.forEach((b, i) => {
                    html += `<tr>
                        <td>${i+1}</td>
                        <td><strong>${b.name}</strong></td>
                        <td>${b.location||'-'}</td>
                        <td>${b.phone||'-'}</td>
                        <td><span class="badge badge-${b.active!==false?'success':'danger'}">${b.active!==false?'نشط':'غير نشط'}</span></td>
                        <td><div class="btn-group">
                            <button class="btn btn-sm btn-info" onclick="openBranchModal('${b.id}')">✏️</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteBranch('${b.id}')">🗑️</button>
                        </div></td>
                    </tr>`;
                });
            }
            html += `</tbody></table></div></div></div>`;
            $('pageContent').innerHTML = html;
        }

        function openBranchModal(id) {
            const items = JSON.parse(localStorage.getItem('erp_branches') || '[]');
            const b = id ? items.find(x => x.id === id) : {};
            let body = `
                <div class="form-group"><label>اسم الفرع *</label><input class="form-control" id="bName" value="${b.name||''}"></div>
                <div class="form-group"><label>الموقع</label><input class="form-control" id="bLoc" value="${b.location||''}"></div>
                <div class="form-group"><label>الهاتف</label><input class="form-control" id="bPhone" value="${b.phone||''}"></div>
                <div class="form-group"><label>الحالة</label><select class="form-control" id="bActive">
                    <option value="true" ${b.active!==false?'selected':''}>نشط</option>
                    <option value="false" ${b.active===false?'selected':''}>غير نشط</option>
                </select></div>
            `;
            openModal(id ? 'تعديل فرع' : 'إضافة فرع', body,
                `<button class="btn btn-primary" onclick="saveBranch('${id||''}')">💾 حفظ</button><button class="btn btn-outline" onclick="closeModal()">إلغاء</button>`
            );
        }

        function saveBranch(id) {
            const name = $('bName').value.trim();
            if (!name) return toast('اسم الفرع مطلوب', 'warning');

            const data = {
                name,
                location: $('bLoc').value.trim(),
                phone: $('bPhone').value.trim(),
                active: $('bActive').value === 'true'
            };

            const items = JSON.parse(localStorage.getItem('erp_branches') || '[]');
            if (id) {
                const idx = items.findIndex(x => x.id === id);
                if (idx >= 0) Object.assign(items[idx], data);
                logActivity('تعديل فرع: ' + name);
            } else {
                data.id = generateId();
                data.createdAt = new Date().toISOString();
                items.push(data);
                logActivity('إضافة فرع: ' + name);
            }
            localStorage.setItem('erp_branches', JSON.stringify(items));
            closeModal();
            renderBranches();
            toast('✅ تم حفظ الفرع', 'success');
        }

        function deleteBranch(id) {
            if (!confirm('حذف الفرع؟')) return;
            let items = JSON.parse(localStorage.getItem('erp_branches') || '[]');
            const b = items.find(x => x.id === id);
            items = items.filter(x => x.id !== id);
            localStorage.setItem('erp_branches', JSON.stringify(items));
            logActivity('حذف فرع: ' + (b ? b.name : id));
            renderBranches();
            toast('🗑️ تم الحذف', 'info');
        }

        // =============================================
        // 29. VIEW INVOICE
        // =============================================
        function viewInvoice(id, type) {
            const items = JSON.parse(localStorage.getItem(`erp_${type}`) || '[]');
            const inv = items.find(x => x.id === id);
            if (!inv) return;

            const company = localStorage.getItem('erp_company') || 'الشركة';
            let body = `
                <div style="background:#fff;color:#000;padding:30px;border:1px solid #eee;">
                    <h2 style="text-align:center;margin-bottom:20px;">${company}</h2>
                    <p class="text-center"><strong>فاتورة ${type === 'sales' ? 'بيع' : 'شراء'}</strong> - ${inv.invoiceNo}</p>
                    <p class="text-center">التاريخ: ${fmtDate(inv.date)}</p>
                    <hr style="margin:15px 0;">
                    <table style="width:100%;border-collapse:collapse;margin-bottom:20px;">
                        <thead><tr style="background:#f8f8f8;"><th style="border:1px solid #ddd;padding:8px;">المنتج</th><th style="border:1px solid #ddd;padding:8px;">الكمية</th><th style="border:1px solid #ddd;padding:8px;">السعر</th><th style="border:1px solid #ddd;padding:8px;">الإجمالي</th></tr></thead>
                        <tbody>${(inv.items||[]).map(i => `<tr><td style="border:1px solid #ddd;padding:8px;">${i.name}</td><td style="border:1px solid #ddd;padding:8px;">${i.qty}</td><td style="border:1px solid #ddd;padding:8px;">${fmt(i.price)}</td><td style="border:1px solid #ddd;padding:8px;">${fmt(i.qty*i.price)}</td></tr>`).join('')}</tbody>
                    </table>
                    <div style="text-align:left;font-weight:bold;font-size:1.2em;">الإجمالي: ${fmt(inv.total)}</div>
                </div>
            `;
            openModal('عرض الفاتورة', body,
                `<button class="btn btn-primary" onclick="window.print()">🖨️ طباعة</button><button class="btn btn-outline" onclick="closeModal()">إغلاق</button>`,
                '800px'
            );
        }

        // =============================================
        // 30. FILTER HELPERS
        // =============================================
        function filterTable(input, tableId) {
            const q = input.value.toLowerCase();
            const rows = document.querySelectorAll(`#${tableId} tbody tr`);
            rows.forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';
            });
        }

        // =============================================
        // 31. BOOTSTRAP
        // =============================================
        window.onload = checkAuth;

        // =============================================
        // 32. GLOBAL EXPOSURE
        // =============================================
        window.navigate = navigate;
        window.toggleSidebar = toggleSidebar;
        window.toggleTheme = toggleTheme;
        window.doLogin = doLogin;
        window.doRegister = doRegister;
        window.doLogout = doLogout;
        window.showRegister = showRegister;
        window.showLogin = showLogin;
        window.closeModal = closeModal;
        window.openModal = openModal;

        // POS
        window.addToCart = addToCart;
        window.changeQty = changeQty;
        window.removeFromCart = removeFromCart;
        window.clearCart = clearCart;
        window.completeSale = completeSale;
        window.updateCart = updateCart;
        window.filterPOS = filterPOS;

        // CRUD
        window.openProductModal = openProductModal;
        window.saveProduct = saveProduct;
        window.deleteProduct = deleteProduct;
        window.openGenericModal = openGenericModal;
        window.saveGeneric = saveGeneric;
        window.deleteGeneric = deleteGeneric;
        window.openPurchaseModal = openPurchaseModal;
        window.savePurchase = savePurchase;
        window.deletePurchase = deletePurchase;
        window.openProjectModal = openProjectModal;
        window.saveProject = saveProject;
        window.deleteProject = deleteProject;
        window.openAssetModal = openAssetModal;
        window.saveAsset = saveAsset;
        window.deleteAsset = deleteAsset;
        window.openTransModal = openTransModal;
        window.saveTrans = saveTrans;
        window.deleteTrans = deleteTrans;
        window.openJournalEntry = openJournalEntry;
        window.saveJournalEntry = saveJournalEntry;
        window.openWorkflowModal = openWorkflowModal;
        window.saveWorkflow = saveWorkflow;
        window.approveWorkflow = approveWorkflow;
        window.rejectWorkflow = rejectWorkflow;
        window.deleteWorkflow = deleteWorkflow;
        window.openUserModal = openUserModal;
        window.saveUser = saveUser;
        window.deleteUser = deleteUser;
        window.openBranchModal = openBranchModal;
        window.saveBranch = saveBranch;
        window.deleteBranch = deleteBranch;
        window.openWarehouseModal = openWarehouseModal;
        window.saveWarehouse = saveWarehouse;
        window.deleteWarehouse = deleteWarehouse;
        window.openQuotationModal = openQuotationModal;
        window.saveQuotation = saveQuotation;
        window.editQuotation = editQuotation;
        window.deleteQuotation = deleteQuotation;
        window.openOrderModal = openOrderModal;
        window.saveOrder = saveOrder;
        window.editOrder = editOrder;
        window.deleteOrder = deleteOrder;
        window.openReturnModal = openReturnModal;
        window.saveReturn = saveReturn;
        window.editReturn = editReturn;
        window.deleteReturn = deleteReturn;
        window.openContractModal = openContractModal;
        window.saveContract = saveContract;
        window.deleteContract = deleteContract;
        window.openTrainingModal = openTrainingModal;
        window.saveTraining = saveTraining;
        window.deleteTraining = deleteTraining;
        window.openDisciplineModal = openDisciplineModal;
        window.saveDiscipline = saveDiscipline;
        window.deleteDiscipline = deleteDiscipline;
        window.openLeaveModal = openLeaveModal;
        window.saveLeave = saveLeave;
        window.approveLeave = approveLeave;
        window.rejectLeave = rejectLeave;
        window.deleteLeave = deleteLeave;
        window.markAttendance = markAttendance;
        window.saveAttendance = saveAttendance;
        window.deleteAttendance = deleteAttendance;
        window.processPayroll = processPayroll;
        window.markPayrollPaid = markPayrollPaid;

        // Reports
        window.generateReport = generateReport;
        window.exportReport = exportReport;
        window.viewInvoice = viewInvoice;
        window.quickSale = quickSale;
        window.saveQuickSale = saveQuickSale;
        window.startInventoryCount = startInventoryCount;
        window.saveInventoryCount = saveInventoryCount;
        window.exportInventory = exportInventory;

        // Settings
        window.saveSettings = saveSettings;
        window.resetSystem = resetSystem;
        window.clearActivity = clearActivity;
        window.filterTable = filterTable;
    </script>
</body>
</html>
